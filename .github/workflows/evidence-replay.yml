name: evidence-replay

# Round 886 — run the evidence replay on a cadence.
#
# R885 built the runner and recorded what each experiment kit rebuilds to, but
# left it `#[ignore]`d and unrun. That is the shape R873 named as the reason
# evidence rots: tracked, and nothing loads it. The cheap declaration gates run
# on every `cargo test` in the main workflow; this is the expensive half.
#
# TWO triggers, because the two things that can break are driven by different
# clocks:
#
#   - `push` / `pull_request`, path-filtered: a digest can only change if an
#     input, a step, or the runner changes. It CANNOT change when `crates/`
#     changes, because every digest is produced by the binary built at the
#     kit's own pinned revision, not by today's. So the filter is tight by
#     construction rather than by guesswork.
#   - `schedule`: a pinned revision that stops building is the world moving,
#     not us — a yanked dependency, a registry that no longer serves an old
#     `Cargo.lock`. No commit of ours triggers that, so only a clock finds it.
#     R880 recorded this residual risk as UNOBSERVED; a weekly run is what
#     turns it into something observed.
#
# `fetch-depth: 0` is load-bearing and not a precaution: the runner does
# `git archive <sha>` for 23 historical commits, and checkout's default shallow
# clone has none of them. Without it every revision fails to extract and the
# job fails for a reason that has nothing to do with the evidence.
#
# R583 is the reason the YAML shape matters here: this repo has already shipped
# a malformed workflow that made CI silently non-running for an unknown stretch.
# R887 gated that class rather than leaving it as a note: this file is parsed on
# every `cargo test`, and the gate fails if the history depth, the `--ignored`
# flag, a named test target, or the path filter's coverage of the replay's own
# inputs ever stops being what this job needs.

on:
  push:
    branches: [main]
    paths:
      - 'claudedocs/phase1-*/**'
      - 'crates/mnemosyne-cli/tests/evidence_replay_smoke.rs'
      - 'crates/mnemosyne-cli/tests/pinned_revision_rechecks_evidence_smoke.rs'
      - '.github/workflows/evidence-replay.yml'
  pull_request:
    paths:
      - 'claudedocs/phase1-*/**'
      - 'crates/mnemosyne-cli/tests/evidence_replay_smoke.rs'
      - 'crates/mnemosyne-cli/tests/pinned_revision_rechecks_evidence_smoke.rs'
      - '.github/workflows/evidence-replay.yml'
  schedule:
    # Mondays, 04:17 UTC. Off the hour so it does not queue behind everything
    # else scheduled on one.
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# R1090 — the reasoning is recorded once, in `mnemosyne-validate.yml`: 29.1 GB of
# this project's own 44.2 GB `target/debug` is DWARF, and `line-tables-only` keeps
# the file and line a panic reports. This job caches no `target`, so this is not
# about the budget; it is about 23 historical workspaces compiled into throwaway
# directories on a runner with 14 GB of disk.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: 0

# R893 — action majors bumped off the deprecated Node 20 runtime; the reading
# behind the target versions is recorded once, in `mnemosyne-validate.yml`.
jobs:
  replay:
    name: replay every kit at its pinned revision
    runs-on: ubuntu-latest
    # Measured locally at 272s for 23 revisions (12.8s per cold isolated
    # build). The margin is for a cold dependency cache, which this job pays
    # more often than most: it compiles 23 different `Cargo.lock`s.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # See the header. The runner extracts historical commits.
          fetch-depth: 0

      - name: Install rust toolchain (rust-toolchain.toml)
        run: rustup show

      # Only the registry, not `target`: each replay builds into a throwaway
      # target dir of its own, so there is nothing there to reuse. What DOES
      # repay caching is the crate sources for 23 historical lockfiles.
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          # R1091 — hashes this workflow too, for the reason recorded once in
          # `mnemosyne-validate.yml`: what a cache holds is decided by the file
          # that declares it, so a key that ignores that file goes on serving an
          # archive of whatever it used to hold.
          key: ${{ runner.os }}-cargo-replay-${{ hashFiles('**/Cargo.lock', '.github/workflows/evidence-replay.yml') }}
          # R1160 — AND NOT `${{ runner.os }}-cargo-`, WHICH USED TO BE HERE. That
          # is a prefix of `Linux-cargo-unrun-`, the one key in this repository
          # holding a build directory, and an archive unpacks AS IT WAS STORED:
          # this job asks for two cargo-home trees and could have 37,427 MB of
          # somebody else's `target` land on it, which nothing here measures,
          # prices or asked for. R1123 closed exactly this for `validate` by
          # renaming the shared key — and this file kept the old spelling in a
          # FALLBACK, where the gate could not see it, because
          # `ci_plan::fallback_reaches` joined on the key's DERIVED prefix
          # (`Linux-cargo-replay-`, which nests under nothing) instead of on the
          # fallbacks actually written. Making that reader honest is what found
          # this; `Linux-cargo-` has named no live key since R1123, so the line
          # was pure harm by then.
          restore-keys: |
            ${{ runner.os }}-cargo-replay-

      # The cheap half first: if a declaration is malformed there is no point
      # compiling 23 workspaces to find out.
      # R1196 — every `cargo test` this repository issues runs through the
      # wrapper that judges what it covered. These three each name ONE target, so
      # what the judgement adds here is not today's coverage but tomorrow's: a
      # `--test` added to any of them is covered without anybody remembering
      # this file, and a target that fails to compile is a refusal rather than a
      # smaller number. See `mnemosyne-validate.yml`'s workspace suite.
      - name: declaration gates
        run: >
          ./scripts/verify.sh --no-fresh --label replay-declarations --
          cargo test -p mnemosyne-cli --test evidence_replay_smoke --locked

      - name: replay
        run: >
          ./scripts/verify.sh --no-fresh --label replay --
          cargo test -p mnemosyne-cli --test evidence_replay_smoke --locked
          -- --ignored --nocapture

      # R1084 — the other `#[ignore]` of this family, which nothing ran.
      #
      # R880 wrote it to measure the one unmeasured assumption the whole
      # `[tool] pin` design rests on: that the revision a kit was authored under
      # STILL BUILDS and still eats the kit's original bytes. It was ignored for
      # cost ("extracts and compiles a second copy of the workspace") with the
      # command to run it written in its own header — and no job ran that
      # command, so the assumption went back to being unmeasured the day it was
      # written. `tools/unrun-tests` found it by asking which tests every CI
      # command executes.
      #
      # HERE rather than in `validate`, and that is the same reasoning this
      # workflow already carries: what breaks it is the world moving — a pinned
      # revision that stops building, a registry that no longer serves an old
      # `Cargo.lock` — which no commit of ours triggers and only the weekly
      # clock finds. It needs exactly what the replay needs and this job already
      # has: full history for `git archive`, and a warm registry for old locks.
      - name: an old revision still builds and still reads its own evidence
        run: >
          ./scripts/verify.sh --no-fresh --label replay-pinned-revision --
          cargo test -p mnemosyne-cli --test pinned_revision_rechecks_evidence_smoke
          --locked -- --ignored --nocapture
