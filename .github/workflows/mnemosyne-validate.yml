name: mnemosyne-validate

# Phase 0 self-application — the option-C carry from the legacy rounds, which
# are off-main by construction and which this store does not hold, so the number
# is not written here as though it could be looked up. Mnemosyne dogfoods its
# own validate-workspace + validate-code-refs on every push / PR. (The atomic
# store is the sole directly-validated SSOT; GENERATED.md / DESIGN.md were
# retired in Round 400, and the markdown source documents before it.)
#
# R583: this file was rewritten from a malformed (unparseable) indentation
# state — the GitHub CI had been silently non-running — and an `msrv` job was
# added to verify the declared MSRV (workspace.package.rust-version) actually
# compiles, after a 1.88 consumer field-flagged a stale, unverified 1.94.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# R893 — the `@v4` lines of both actions declare `runs.using: node20`, which
# GitHub deprecated on 2025-09-19 and now force-runs on Node 24. Every run in
# this repo's visible history carried the warning (measured back to 2026-05-07,
# where the wording was still the pre-forcing one) and nothing read it. node24
# starts at checkout v5 / cache v5 — measured from each tag's own `action.yml`,
# not from the blog post. The majors past that were read rather than skipped:
# checkout v6 moves credentials to a separate file and v7 blocks fork-PR
# checkout for `pull_request_target` / `workflow_run` (neither trigger is used
# here, and v7.0.1 skips that check when `ref` is defaulted, as it is here);
# cache v6 is an ESM migration. Both require runner >= 2.327.1 — this repo's
# hosted runner reported 2.336.0 on the last green run, and a self-hosted one
# would have to be checked.
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # R889 — `cargo test --workspace` includes the evidence-replay
          # declaration gates, and those resolve pinned historical commits. A
          # shallow clone has none of them, so the gates could not run here at
          # all. Nobody saw it because R888's missing `protoc` killed the build
          # first: two defects stacked, and fixing the outer one uncovered this.
          fetch-depth: 0

      # R888 — `mnemosyne-server`'s build script runs tonic-build, which shells
      # out to `protoc`. The hosted runner does not ship one, so `cargo test
      # --workspace` failed at BUILD, before a single test ran, on every push
      # for at least four commits. It is installed from the runner's own apt
      # source rather than a third-party action: one less thing to trust, and
      # the version question is prost-build's, which accepts what Ubuntu ships.
      - name: Install protoc (mnemosyne-server build script)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install rust toolchain (rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo test --workspace
        run: cargo test --workspace --locked

      - name: mnemosyne-cli validate-workspace
        run: cargo run --release -q -p mnemosyne-cli -- validate-workspace

      - name: mnemosyne-cli validate-code-refs (Round 257 Stage 2)
        # Subcommand skips when [plugins.set_equality_validator] is
        # unconfigured; when configured with severity_missing = "reject",
        # missing citations fail the build.
        run: cargo run --release -q -p mnemosyne-cli -- validate-code-refs

      # R1081 — in test code a wait ends on a condition and its budget is named.
      # R1073 turned this branch red with an assertion whose subject was the
      # scheduler; R1075 swept `bench` and found the same shape twice more; this
      # is the sweep of the tree that runs on EVERY push, and it found nine
      # sites, four of them waits that end on a clock. A step here rather than
      # its own job because the gate parses instead of building: measured at
      # 9.5s warm and 33.4s including its own cold compile, against this job's
      # 30-minute budget with 15 minutes of headroom.
      - name: blind-waits (a wait ends on a condition, its budget is named)
        run: >
          cargo run -q --manifest-path tools/blind-waits/Cargo.toml
          --bin blind-waits -- --workspace Cargo.toml

  # R1077 pointed rustdoc at this workspace for the first time and gave the
  # `[`foo`]` citation the gate `validate-code-refs` gives `Round NNN`. It ran
  # `cargo doc --workspace`, and R1078 measured what that reaches: 25 of this
  # workspace's 136 targets. Not one of the 106 test targets — R1076 had just
  # shipped a citation to a `searchable` named `spelled` inside one — and not a
  # binary whose name collides with its package's library, which is how
  # `crates/mnemosyne-cli/src/main.rs` carried a `DisclosureReveal` that exists
  # nowhere while the gate reported exit 0. Both were live on the commit that
  # shipped the first gate.
  #
  # `tools/item-citations` documents every target cargo lists, asks a test
  # target's own harness for the names rustdoc structurally cannot see
  # (a `#[test]` item is expanded away outside test mode), and REPORTS WHAT IT
  # REACHED — because a gate that never opened a target and a gate that found
  # nothing wrong in it print the same thing.
  #
  # ITS OWN JOB rather than a step in `validate`, and that is measured: the
  # `cargo doc` step it replaces cost 6m49s of that job's 21m40s against a
  # 30-minute budget, and this does five times the documenting. Run beside
  # `validate` it costs wall-clock nothing and carries its own budget; run
  # inside it, it would be the thing that eventually turns the whole gate red by
  # running out of minutes.
  item-citations:
    name: item citations name items
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Same reason as `validate`: documenting `mnemosyne-server` runs its build
      # script, which shells out to protoc.
      - name: Install protoc (mnemosyne-server build script)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install rust toolchain (rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo (item citations)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tools/item-citations/target
          key: ${{ runner.os }}-cargo-citations-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-citations-

      - name: every item citation in the workspace names an item
        run: >
          cargo run -q --manifest-path tools/item-citations/Cargo.toml
          --bin item-citations -- --workspace Cargo.toml

  # R1062 built an instrument nothing ran. This repository has four SEPARATE
  # workspaces (`bench/`, `studio/`, `tools/*`) which carry their own
  # `[workspace]` so the root gates never compile them — deliberate, and it left
  # their tests run only when a person remembered. When this job was written two
  # of the four were already rotted: `studio/` did not compile at all and
  # `bench/` had 6 failing tests. Nothing had failed, because nothing had asked.
  #
  # The script is the single source for WHICH are run and why the rest are not,
  # so a person runs exactly what this job runs, and every skip prints its
  # reason. `protoc` is not installed here on purpose: none of these workspaces
  # builds `mnemosyne-server`, and a job that installs what it does not need
  # hides the day it starts needing it.
  side-workspaces:
    name: separate in-repo workspaces
    runs-on: ubuntu-latest
    # R1067 — 60 rather than the 30 the other jobs carry, because this one's
    # cost changed under it. Its first run took 28 SECONDS: `bench` and `studio`
    # were both skipped and only the two tool workspaces were built. `bench` is
    # in it now — five crates over RocksDB and sled — and it is checked twice,
    # once by clippy and once by the test build. Measured cold at four cores
    # (the runner's count) on the machine this was written on: 4m11s for the
    # test build alone, and a hosted core is slower than that machine's. A job
    # that runs out of budget is a red CI nobody can read a result from, and the
    # minutes are free on a public repository.
    #
    # ITS ARTIFACTS ARE DELIBERATELY NOT CACHED, and that is measured too: the
    # four workspaces' `target` directories come to 3.9 GB, against a 10 GB
    # per-repository cache that the `validate` job's own cache already lives in.
    # Caching these would evict that one, trading a job that rebuilds for a job
    # that rebuilds AND a slower one beside it.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install rust toolchain (rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo (side workspaces)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-side-${{ hashFiles('bench/Cargo.lock', 'tools/*/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-side-

      - name: fmt, clippy and test in every separate in-repo workspace
        run: ./scripts/check-side-workspaces.sh

  # R1081 — the targets `cargo test --workspace` compiles to NOTHING.
  #
  # `mnemosyne-server` declares `default = []` and puts its TLS and OTLP
  # surfaces behind `tls` and `otlp`. Every test file for them opens with
  # `#![cfg(feature = ...)]`, so under the workspace suite this repository has
  # been running since R583 they are empty crates. Measured on the commit that
  # added this job, from that suite's own output: SIX integration test targets
  # reported `running 0 tests` — `grpc_tls_smoke`, `grpc_mtls_smoke`,
  # `grpc_otlp_smoke`, `grpc_otlp_collector_e2e`, `grpc_otlp_config_smoke` and
  # `grpc_otlp_sampling_zero_smoke`. Nine tests, none of which had ever run in
  # CI, and four of R1081's blind waits lived in them: a 50ms `sleep` under the
  # comment "tiny grace" survives indefinitely when nothing executes it.
  #
  # `--all-features` rather than the two named, so a feature added tomorrow is
  # covered without anybody remembering this file. `-p mnemosyne-server` rather
  # than `--workspace`, because feature unification across the whole workspace
  # rebuilds far more than the crate under test for no added coverage.
  #
  # Measured before it was written down: 354.9s wall and 1.43 GiB peak RSS on
  # this project's 32-core machine, INCLUDING a cold librocksdb-sys build. A
  # hosted core is slower and there are four of them, hence 45 rather than 30.
  server-features:
    name: the server targets the workspace suite compiles to nothing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install protoc (mnemosyne-server build script)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install rust toolchain (rust-toolchain.toml)
        run: rustup show

      # Its own key: this build resolves different features than `validate`'s,
      # so sharing a cache would make each run evict the other's artifacts.
      - name: Cache cargo (server features)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-serverfeat-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-serverfeat-

      # LINT IT TOO, and that is not symmetry for its own sake: the first time
      # anything linted this build it found a `MutexGuard` held across an await
      # in `grpc_otlp_config_smoke.rs` — a deadlock shape that never bit only
      # because the code it is in had never been compiled by a gate. The
      # workspace clippy above cannot see it: `--all-targets` still resolves
      # `default = []`.
      - name: cargo clippy -p mnemosyne-server --all-features
        run: >
          cargo clippy -p mnemosyne-server --all-features --all-targets
          --locked -- -D warnings

      - name: cargo test -p mnemosyne-server --all-features
        run: cargo test -p mnemosyne-server --all-features --locked --no-fail-fast

  # R1084 — the level above `server-features`. That job exists because six test
  # targets compiled to nothing; R1082 then gated the general form of WHY they
  # were dark (a feature nobody compiles). Compiling is not running: an
  # `--all-features` build keeps passing after every test behind those features
  # is deleted, and an `#[ignore]` nobody ever passes `--ignored` for is a test
  # that exists and that nothing executes.
  #
  # This asks both sides of the machine. POPULATION: for every workspace the
  # lister says this machine can build, `cargo test --workspace --all-features
  # --no-run`, then each test binary's own `--list`, plus `--doc` for the tests
  # that have no binary. RUN: every `cargo test` this repository's workflows and
  # its workspace lister issue, re-run with `--list` appended to ITS OWN harness
  # arguments, minus what that command leaves `#[ignore]`d.
  #
  # ITS OWN JOB, for the reason `item-citations` has one: it compiles every
  # workspace twice over, once as CI configures it and once with every feature.
  #
  # THE BUDGET IS AN UPPER BOUND ARGUED FROM THE OTHER JOBS, not a number this
  # round measured on a runner — it has run only on a 32-core machine, where it
  # takes 71s fully warm. What it builds is strictly more than either of the two
  # jobs that build: everything `validate` compiles (30 minutes, and it has used
  # 20) plus everything `separate in-repo workspaces` compiles (60 minutes, and
  # it has used 19), plus an `--all-features` resolve of each, which is a
  # different resolve and therefore a different build. 90 is the sum with room;
  # the minutes are free on a public repository and a job that runs out of them
  # is a red CI nobody can read a result from.
  #
  # Its first run found eleven, and every one was real: nine tests disabled in
  # Round 252 against a document model Round 400 deleted, an `#[ignore]`d proof
  # whose own header wrote out the command nobody ran, and a `​```ignore` doc
  # example that no compiler had ever read.
  unrun-tests:
    name: every test compiled is one CI runs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install protoc (mnemosyne-server build script)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install rust toolchain (rust-toolchain.toml)
        run: rustup show

      # Its own key: this job resolves `--all-features` for the whole workspace,
      # which is neither `validate`'s resolve nor `server-features`', so sharing
      # a cache would make each run evict the other's artifacts.
      - name: Cache cargo (unrun tests)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            tools/unrun-tests/target
          key: ${{ runner.os }}-cargo-unrun-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-unrun-

      - name: every test this repository compiles is one some CI command runs
        run: >
          cargo run -q --manifest-path tools/unrun-tests/Cargo.toml
          --bin unrun-tests

  msrv:
    name: MSRV (workspace.package.rust-version)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Verify the declared MSRV actually compiles. The version is read from
      # Cargo.toml (single source — no drift with rust-version). rust-toolchain.toml
      # pins the newer *dev* toolchain; RUSTUP_TOOLCHAIN overrides it so this job
      # builds on the MSRV itself (dev-on-latest, support-down-to-MSRV).
      # Same reason as the validate job: `cargo check --workspace` builds
      # `mnemosyne-server`'s script too, so this job was failing on the missing
      # `protoc` as well.
      - name: Install protoc (mnemosyne-server build script)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          echo "version=$(grep -oP 'rust-version\s*=\s*"\K[0-9.]+' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Install MSRV toolchain
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal

      - name: Cache cargo (MSRV)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-

      - name: cargo check --workspace on MSRV
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo check --workspace --locked
