name: mnemosyne-validate

# Phase 0 self-application — the option-C carry from the legacy rounds, which
# are off-main by construction and which this store does not hold, so the number
# is not written here as though it could be looked up. Mnemosyne dogfoods its
# own validate-workspace + validate-code-refs on every push / PR. (The atomic
# store is the sole directly-validated SSOT; GENERATED.md / DESIGN.md were
# retired in Round 400, and the markdown source documents before it.)
#
# R583: this file was rewritten from a malformed (unparseable) indentation
# state — the GitHub CI had been silently non-running — and an `msrv` job was
# added to verify the declared MSRV (workspace.package.rust-version) actually
# compiles, after a 1.88 consumer field-flagged a stale, unverified 1.94.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# R1090 — WHAT THE CACHED ARTIFACTS ARE MADE OF, measured rather than assumed.
#
# Of the 44.2 GB this project's own `target/debug` holds, 29.1 GB is DWARF: the
# 401 test executables cargo left in `deps/` are 26.2 GB, and 83.2% of those
# bytes are `.debug_*` sections (`size -A`, every one of the 401, none of them
# zero); the rlibs, objects, archives and shared objects beside them are another
# 15.0 GB at 49.2%. Nothing else in a `target` is remotely that big, and the
# cache these jobs save is mostly one of those directories.
#
# `line-tables-only` rather than `0` because this repository already made that
# trade once, for `[profile.release]` in the root `Cargo.toml`: it keeps the
# file and line a panic reports, which is the whole diagnostic value of a failing
# CI run, and drops the type and location tables nobody reads off a runner. Set
# here rather than in `.cargo/config.toml` because it is a statement about CI:
# a developer stepping through a debugger on this machine wants the rest.
#
# `CARGO_INCREMENTAL=0` because incremental state is a per-machine, per-build
# scratch space that every one of these jobs writes once and no job ever reads
# twice — pure cache weight, and cargo's own advice for CI.
#
# R1092 — `RUSTC_WRAPPER` IS HOW THIS FILE GETS MEASURED. Seven jobs below build
# this workspace, and the reason given for keeping them apart has always been
# that they resolve different features — written as prose, in four separate
# comments, never once counted. `tools/rustc-log` sits in front of every `rustc`
# and records the invocation; `tools/twice-compiled` joins the logs and reports
# how many compilations two jobs both pay for. It reaches the builds a GATE
# spawns by shelling out to cargo, which is most of the work in three of these
# jobs and is invisible to `--message-format=json`.
#
# R1093 — AND WHAT EACH ONE COST. The wrapper runs the compiler and waits for it
# rather than becoming it, so every record carries when the compilation started
# and how long it ran. A count says how much work is done twice; only the seconds
# say whether removing a given half of it is worth the wall-clock that merging
# two jobs spends, and the first census ranked by rows put a build script at the
# head of a list nobody would repair a build script for.
#
# The log path is per job and is set on each job rather than here, because
# `${{ github.job }}` is defined by the runner only INSIDE a step and evaluates
# to nothing in an `env:` block — every job would append to one file, and a
# census of one job reports no duplication at all. So each job names its own log
# by hand, and `tools/twice-compiled` checks that the name is the job's.
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: ${{ github.workspace }}/instruments/release/rustc-log

# R1091 — EVERY CACHE KEY IN THIS FILE HASHES THIS FILE, and that is a defect
# repair rather than belt-and-braces. A key that hashes only the lockfiles says
# "this cache is valid while the dependencies are", but what a cache HOLDS is
# decided here, in its `path:` list. R1090 removed the root `target` from four
# keys and nothing happened: `actions/cache` had an exact hit on every one of
# them, so it never saved, and GitHub went on serving archives containing the
# very directory the workflow had just stopped asking for. The repair could not
# take effect until something unrelated moved a lockfile — and the same trap sat
# under R1091's own repair, which is how it was found.
#
# So the key depends on the file that decides the key. A workflow edit costs one
# cold run of everything, which is the honest price of changing what CI keeps,
# and `tools/cache-budget` reads these globs off the key to know that such a run
# is legitimate rather than a job that lost its cache.

# R893 — the `@v4` lines of both actions declare `runs.using: node20`, which
# GitHub deprecated on 2025-09-19 and now force-runs on Node 24. Every run in
# this repo's visible history carried the warning (measured back to 2026-05-07,
# where the wording was still the pre-forcing one) and nothing read it. node24
# starts at checkout v5 / cache v5 — measured from each tag's own `action.yml`,
# not from the blog post. The majors past that were read rather than skipped:
# checkout v6 moves credentials to a separate file and v7 blocks fork-PR
# checkout for `pull_request_target` / `workflow_run` (neither trigger is used
# here, and v7.0.1 skips that check when `ref` is defaulted, as it is here);
# cache v6 is an ESM migration. Both require runner >= 2.327.1 — this repo's
# hosted runner reported 2.336.0 on the last green run, and a self-hosted one
# would have to be checked.
jobs:
  # R1230 — THIS JOB'S BUDGET IS 90 BECAUSE ROUND 1229 CHANGED WHAT ITS LONGEST
  # STEP DOES AND LEFT THE NUMBER WHERE IT WAS.
  #
  # MEASURED, on the first hosted run that carried the census: `cargo test
  # --workspace` ran 29m32s and was CANCELLED at this job's 30-minute limit,
  # taking the whole verdict with it — the suite's own result, the four gates
  # after it, and the two jobs that `needs:` this one. A measurement destroyed
  # the thing it was measuring, which is the worst way for a gate to be wrong.
  #
  # The number this file HAD was argued for the job as it stood: 20m5s cold on
  # the timetable at R1091, and the `blind-waits` comment below still claimed
  # fifteen minutes of headroom. `strace -f` with `%file,%process` over 156,692
  # processes is a multiplier on every syscall the suite makes, and the true
  # figure is not known — the run that would have measured it is the one that
  # was cancelled.
  #
  # SO 90, THE SAME NUMBER AND THE SAME ARGUMENT AS `uncompiled-sources`: an
  # upper bound argued from the other jobs rather than measured on a runner,
  # because a job that runs out of minutes is a red CI nobody can read a result
  # from. `unrun-tests`, the heaviest job here, is budgeted 90 and has measured
  # 23m45s to 28m29s. The first run under this number is what measures it.
  #
  # R1276 — AND THE THING THAT NUMBER WAS ARGUED FOR HAS LEFT THIS JOB. The
  # census moved to `outside-reach` below, so the paragraphs above describe a
  # shape this job no longer has: what they measured was `strace` on the suite
  # step, and R1275 put a figure on it — about sixty per cent, the same tests
  # run slower. The number STAYS AT 90 anyway and that is deliberate rather than
  # neglect. Lowering it now would be arguing from the traced runs, which are
  # the only ones this record holds for this shape; the first runs after this
  # commit are what measure the untraced job, and `tools/ci-state` prints that
  # share on every push. A budget that is generous is not a defect; a number
  # nobody can say the provenance of is.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MNEMOSYNE_RUSTC_LOG: ${{ github.workspace }}/rustc-log/validate.log
      # R1101 — and what this job STARTED FROM, beside what it compiled, because
      # the second is measured in the units of the first: cargo runs no compiler
      # for a unit that is already fresh.
      MNEMOSYNE_RESTORED: ${{ github.workspace }}/rustc-log/validate.restored
    steps:
      - uses: actions/checkout@v7
        with:
          # R889 — `cargo test --workspace` includes the evidence-replay
          # declaration gates, and those resolve pinned historical commits. A
          # shallow clone has none of them, so the gates could not run here at
          # all. Nobody saw it because R888's missing `protoc` killed the build
          # first: two defects stacked, and fixing the outer one uncovered this.
          fetch-depth: 0

      # R1276 — THIS JOB FETCHES NOTHING FROM AN ARCHIVE ANY MORE. The `strace`
      # install that stood here belonged to the census, and the census now has a
      # job of its own (`outside-reach` below), so the step went with it. That is
      # worth naming rather than leaving as an absence: on 2026-08-19 four
      # consecutive runs of `main` died in this step, the last of them with
      # R1251's retries — the measurement that a fetch you do not make is the
      # only one that cannot stall — and the job on every push is now one of the
      # jobs that makes none.
      - name: Install rust toolchain (rust-toolchain.toml)
        # R1237 — `rustup show` DOWNLOADS the toolchain when it is not already
        # there, so this is a network fetch and not a report. Measured on the
        # last fully green run: 8 to 10 seconds. See `validate`'s `apt-get` step
        # for why five minutes, and `bounded_fetch_steps.rs` for the law.
        timeout-minutes: 5
        run: rustup show

      # R1092 — the recorder cannot record its own build: it does not exist yet,
      # and an empty `RUSTC_WRAPPER` is how cargo is told there is none. This is
      # the ONE step in a job excused from recording, and `tools/twice-compiled`
      # derives that excuse from the manifests these lines name rather than from
      # a list of jobs, so it stays one step wide. R1101 put the restore measure
      # here too: an instrument's own build is not a cost CI pays for this
      # repository's sake, and counting it would put the instrument inside its
      # own reading. What it costs is two crates with no dependencies — the
      # reason neither has any.
      - name: Build the instruments
        env:
          RUSTC_WRAPPER: ""
          # R1118 — OUTSIDE THE TREE ANY CACHE HOLDS, and this is a repair rather
          # than tidiness. `unrun-tests` caches `target`, and its restore runs
          # AFTER this step: the 8.90 GB that arrives overwrites the binaries
          # this step just built with the previous generation's. R1117 changed
          # the record format and that job died — `restored before` wrote a line
          # that `restored after`, a DIFFERENT PROGRAM by then, refused to read.
          # It is the only job that caches a build directory and the only one
          # that failed, which is what named the mechanism.
          #
          # WORSE THAN THE RED RUN: nothing had changed the format before, so the
          # same substitution had been silent every run. `RUSTC_WRAPPER` points
          # at one of these binaries, so that job's whole compilation census was
          # taken by whatever the last generation's cache happened to hold.
          # `tools/twice-compiled` now refuses a program a job runs after a
          # restore that lives under a path the cache holds.
          #
          # RELATIVE AND NOT `${{ github.workspace }}/instruments`, for R1117's
          # reason: a GitHub expression makes a step unreplayable, and putting one
          # here took all nine jobs out of the local replay's census at once —
          # including the ones with no cache at all. Cargo resolves a relative
          # `CARGO_TARGET_DIR` against the working directory, which is the
          # checkout root for every step in this file. Measured, by building
          # `tools/rustc-log` with it set and finding the binary at
          # `<root>/instruments/release/rustc-log`.
          CARGO_TARGET_DIR: instruments
        run: |
          cargo build --release -q --locked --manifest-path tools/rustc-log/Cargo.toml
          cargo build --release -q --locked --manifest-path tools/restored/Cargo.toml

      # ONE OF THE TWO JOBS IN THIS FILE THAT KEEPS A `target`, and R1090
      # measured which two. GitHub gives a repository 10 GB of cache and deletes,
      # least recently used first, until the total fits; six jobs here each asked
      # to keep a whole build tree, and the arithmetic was 63 GB. The symptom was
      # that NOTHING was ever warm: `unrun-tests` ran 27m, 27m and 28m on three
      # consecutive pushes, and when this was written GitHub was holding exactly
      # ONE of the eight keys this repository declares.
      #
      # The two kept are the two the cache decides, measured over the four runs
      # before this one: `unrun-tests` at 28m29s / 27m0s / 27m58s / 15m1s and this
      # job at 18m6s / 24m19s / 18m16s / 16m17s. Neither has ever been warm.
      #
      # THE FOUR THAT GAVE THEIRS UP DO SOMETIMES RUN WARM, and that is the cost
      # this pays rather than a cost it denies: over those same four runs they
      # measured 52s–140s warm against 6m47s–15m1s cold. What it does not cost is
      # WALL-CLOCK, which is the number a push waits on: `separate in-repo
      # workspaces` caches no `target` at all and has run 20m6s / 20m14s / 21m24s
      # / 20m27s, so it is the floor, and every one of the four is under it cold.
      # Four jobs occasionally saving five minutes each is what was being paid for
      # with a budget that then kept nothing warm at all.
      #
      # `tools/cache-budget` is what keeps this true; a comment is what it was
      # before, and four rounds each contradicted it locally-correctly.
      #
      # R1091 — AND THAT GATE IMMEDIATELY CORRECTED THE PARAGRAPH ABOVE. It turned
      # this branch red at 11.81 GB, because `unrun-tests` saved 7.83 GB rather
      # than the ~3.9 GB predicted for it. The run that failed is the first in
      # this repository's history where EVERY job was cold — the stale
      # generations had been deleted before it — so it is the first comparable
      # timetable this file has ever had:
      #
      #   unrun-tests        23m45s   (7.83 GB, and it keeps its build tree)
      #   side-workspaces    20m48s   (caches no `target` at all)
      #   validate           20m5s    (this job)
      #   uncompiled 14m25s, server-features 13m43s, item-citations 13m37s
      #
      # SO THIS JOB GIVES UP ITS BUILD TREE TOO, and it costs no wall-clock to do
      # it: `separate in-repo workspaces` keeps nothing and runs LONGER than this
      # job does cold, so it is the floor a push waits on and warming this one
      # cannot get underneath it. `unrun-tests` is the only job above that floor,
      # which makes it the only one whose build tree is worth the budget.
      # R1101 — WHAT THIS JOB STARTED FROM, measured either side of the restore.
      # `actions/cache` declares exactly one output, `cache-hit`, and its own
      # documentation says a `restore-keys` prefix match returns `false` for it:
      # the action that did the restoring cannot say whether anything arrived.
      # Neither can the cache API — a job warmed by a prefix hit still saves a
      # new entry, which is what `cache-budget` reads as a cache built from
      # nothing. That third state is the one R1099 misread, and the only place
      # it is legible is the disk.
      #
      # The paths are this cache's own `path:` list, written a second time
      # because nothing can hand them over; `twice-compiled` refuses if the two
      # ever say different things.
      # R1117 — WHICH CACHE THE INTERVAL IS THE PRICE OF. A record used to be a
      # job's; a job may declare more than one cache, and the price of a 32 GB
      # build directory read off a 756 MB registry's restore is the arithmetic
      # R1099 got wrong when it deleted a cache that was saving ten minutes.
      #
      # THE PREFIX IS WRITTEN RESOLVED AND NOT AS `${{ runner.os }}`, and that is
      # measured rather than preferred: an expression inside a `run:` script
      # makes the step unreplayable, and `twice-compiled`'s local replay then
      # drops the job from its census — putting the expression here took all
      # seven cached jobs out of it at once. What makes the literal safe is that
      # nothing trusts it: `tools/twice-compiled` refuses a record naming a cache
      # its job does not declare, against the prefix `ci_plan` resolves from the
      # key below. Two spellings, compared — which is the rule R1116 wrote after
      # finding `restore-keys` spelled twice and compared never.
      # R1123 — A KEY OF ITS OWN, LIKE EVERY OTHER JOB HERE, and this is a repair
      # rather than tidiness. This was the repository's oldest key and it is a
      # PREFIX of every other one in the file, so `restore-keys` falls back onto
      # any of their archives — which is harmless for the five that hold exactly
      # the two cargo-home trees this job holds, and is not for `unrun-tests`'
      # build directory. An archive unpacks AS IT WAS STORED: `path:` says what a
      # cache SAVES and cannot stop 8.90 GB of somebody else's `target` landing
      # in a job that never asked for it, measured nothing of it, and prices none
      # of it. `tools/cache-budget` refuses that shape now, which is what makes
      # this rename load-bearing rather than cosmetic.
      #
      # THE OLD ARCHIVE IS LEFT HELD AND DECLARED BY NOTHING for the seven days
      # it takes to age out. That used to be a refusal of its own and is now
      # COUNTED against the budget instead — the harm a renamed key does is
      # bytes, and bytes are arithmetic. R1122 had to pin this defect rather than
      # close it precisely because the gate refused the only repair for it.
      - name: What is on disk before the cache is restored
        run: >
          ./instruments/release/restored before
          --cache 'Linux-cargo-validate-'
          '~/.cargo/registry' '~/.cargo/git'

      - name: Cache cargo
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-validate-${{ hashFiles('**/Cargo.lock', '.github/workflows/mnemosyne-validate.yml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-validate-

      - name: What the cache restored
        env:
          MNEMOSYNE_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: ./instruments/release/restored after

      # R1194 — `--no-fail-fast`, and it was the ONE cargo test command in this
      # repository without it. The server suite below carries it, and so does
      # every separate workspace's in `scripts/check-side-workspaces.sh`, whose
      # comment records what its absence cost there: the gate reported that
      # `bench` had 6 failures, and the 6 were one target's — there were 18.
      # Without it cargo stops at the first failing target, so the count in this
      # job's log is one target's and somebody fixes to it; the targets behind it
      # are not red, they were never asked.
      #
      # R1196 — AND THROUGH THE WRAPPER THAT JUDGES WHAT THE RUN COVERED. The
      # flag above is discipline and it has a hole the flag cannot close: a
      # target that fails to COMPILE stops cargo whatever `--no-fail-fast` says,
      # and the targets behind it are not red, they were never asked.
      # `scripts/verify.sh` holds this run's log against what cargo says this
      # command compiles, so a job whose verdict covered less than it looks like
      # says so instead of reporting one target's number. `--no-fresh` because a
      # runner's checkout has no uncommitted change for the freshness pass to
      # clean.
      # R1276 — AND THE CENSUS THAT WRAPPED THIS STEP HAS ITS OWN JOB NOW.
      #
      # THE REASON R1229 GAVE FOR NOT DOING THAT WAS NEVER TRUE. It read: "a
      # separate job would compile the whole workspace again, which is the
      # duplication `tools/twice-compiled` exists to forbid". That gate forbids
      # no such thing — its own header says the duplication is "REPORTED rather
      # than refused, because the number is what licenses the repair", and seven
      # jobs in this file build this workspace today while it passes. What it
      # refuses is a job that compiles and leaves no record, a job that records
      # counts and no seconds, and a job with a cache that did not say what the
      # cache brought. Nobody asked the machine, and a false sentence about a
      # gate in this repository sat in a load-bearing comment for forty-seven
      # rounds.
      #
      # WHAT IT COST WHILE IT STOOD HERE, measured in R1275: `strace -f` over
      # this suite is a MULTIPLIER, and it multiplied this job by about sixty per
      # cent — `crates/mnemosyne-cli/tests/all.rs` 856 s → 1369 s with its test
      # count going 374 → 377, and the workspace's other `tests/all.rs` +163%
      # with its 42 tests unchanged. The same tests, run slower.
      #
      # AND THE OBSERVER WAS INSIDE THE MEASUREMENT, which is the reason this
      # move is a correctness repair and not a saving. Rounds 1245, 1260, 1261,
      # 1270, 1274 and 1275 built an apparatus whose whole subject is what this
      # workflow's jobs cost, and every one of its numbers is read off this job's
      # budget share. Under the tracer that share was mostly instrument — and the
      # tracer moved the NOISE further than the level: across this repository's
      # own record the completed runs of `validate` go from a coefficient of
      # variation of 3.8% (n=4, so read the direction rather than the figure) to
      # 10.7% (n=26), spread 151 s → 832 s. R1270's "adjacent commits move it by
      # as much as 13 point(s) on their own" was largely `strace`.
      #
      # THE PRECEDENT IS IN THIS FILE. `item-citations` is its own job for the
      # same argument, written there: "Run beside `validate` it costs wall-clock
      # nothing and carries its own budget; run inside it, it would be the thing
      # that eventually turns the whole gate red by running out of minutes."
      # R1230 records that happening — the census took the 30-minute budget and
      # the whole verdict with it.
      #
      # WHAT MOVED IS THE WRAP AND NOTHING ELSE. Every argument the census makes
      # for its own shape — the pipe that writes no bytes, the seven descriptor
      # syscalls named individually, why `%file` must not be narrowed, why the
      # verdict is read from a file — is unchanged and now lives with the step
      # that carries it, in `outside-reach` below.
      - name: cargo test --workspace
        run: >
          ./scripts/verify.sh --no-fresh --label ci-workspace --
          cargo test --workspace --locked --no-fail-fast

      # R1287 — THE GATE THAT HAD RUN NOWHERE BUT A WORKSTATION. `pre-push` had
      # clippied this workspace since long before there was a hosted run to
      # compare against, and nothing here ever did: `server-features` clippies
      # ONE package with its features on, and a census keyed by subcommand and
      # manifest reads those two as the same gate, because neither spells
      # `--manifest-path`. They are not. A checkout that never ran
      # `git config core.hooksPath .githooks` had no lint gate at all, and the
      # push that was supposed to be the backstop could be refused by a build
      # machine holding another checkout — which is how this was found.
      #
      # HERE RATHER THAN IN A JOB OF ITS OWN, and the numbers are the reason.
      # Measured on run 32641022360, ten jobs green: this job took 27m33s of a
      # 90-minute budget and the longest job in the run took 34m40s. A step here
      # meets a warm cargo home and a registry this job's cache already holds; a
      # separate job would pay a cold dependency build and take a second slice of
      # a 10 GB per-repository cache, which is the trade `side-workspaces`
      # records having lost.
      #
      # `--all-targets` BECAUSE THE HOOK SPELLED IT: test and bench targets are
      # most of this repository's Rust, and a lint gate that skips them is a
      # different gate wearing the same name.
      - name: cargo clippy --workspace --all-targets
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      # R1287 — AND THE FOUR TREE GATES THE COMMIT HOOK WAS THE ONLY READER OF.
      # Each asks a question about THIS REPOSITORY rather than about the machine
      # running it — an environment variable nobody names, a scratch file no
      # workspace owns, a tracked file whose mode disagrees with its shebang, a
      # declaration nothing reads — so a runner can ask them, and until now no
      # runner did. They cost seconds and they sit beside `blind-waits` below,
      # which is here for the same reason and was the first of this shape.
      #
      # WHAT IS DELIBERATELY NOT HERE, so the absence is a decision rather than
      # an oversight: `one-machine` and `ci-state`. Both are about the fleet this
      # push is leaving FROM — one dispatches this tree to a second machine and
      # reads what it found, the other reports what a hosted run of the previous
      # commit concluded. On a runner the first has no second machine and the
      # second would be reading itself. `git_hooks_smoke` holds that reasoning as
      # a list the compiler makes somebody edit, not as this comment.
      - name: named-environment (every environment variable is named)
        run: >
          cargo run -q --locked --manifest-path tools/named-environment/Cargo.toml
          --bin named-environment -- --workspace Cargo.toml

      - name: unowned-scratch (every scratch path a workspace owns)
        run: >
          cargo run -q --locked --manifest-path tools/unowned-scratch/Cargo.toml
          --bin unowned-scratch -- --workspace Cargo.toml

      - name: written-executable (a file's mode agrees with what it is)
        run: >
          cargo run -q --locked --manifest-path tools/written-executable/Cargo.toml
          --bin written-executable -- --workspace Cargo.toml

      # WHY `unread-declaration` IS NOT A STEP HERE, and why removing it was not
      # a deletion. It holds `.claude/remote-build.toml` against the program that
      # READS it, and that program is `$HOME/.claude/remote-build/bin/bx` — a
      # machine-wide binary this repository does not track and no job installs.
      # A runner has no such file, so this gate's only honest answer here is
      # exit 2, NO VERDICT, which is exactly what it printed on every push from
      # the day it was given this step. Its subject is the FLEET a push leaves
      # from, not the tree a runner checks out.
      #
      # It is excused in `git_hooks_smoke::CANNOT_LEAVE_THIS_MACHINE` beside the
      # two gates that were already there, and
      # `no_hosted_job_runs_a_gate_that_reaches_for_a_program_under_home` is what
      # keeps this comment from being the only thing that says so: it derives
      # the population from the tools' own source and goes red if a step for one
      # of them comes back.

      - name: mnemosyne-cli validate-workspace
        run: cargo run --release -q --locked -p mnemosyne-cli -- validate-workspace

      - name: mnemosyne-cli validate-code-refs (Round 257 Stage 2)
        # Subcommand skips when [plugins.set_equality_validator] is
        # unconfigured; when configured with severity_missing = "reject",
        # missing citations fail the build.
        run: cargo run --release -q --locked -p mnemosyne-cli -- validate-code-refs

      # R1081 — in test code a wait ends on a condition and its budget is named.
      # R1073 turned this branch red with an assertion whose subject was the
      # scheduler; R1075 swept `bench` and found the same shape twice more; this
      # is the sweep of the tree that runs on EVERY push, and it found nine
      # sites, four of them waits that end on a clock. A step here rather than
      # its own job because the gate parses instead of building: measured at
      # 9.5s warm and 33.4s including its own cold compile, which is noise beside
      # the step above it whatever this job's budget is. THE HEADROOM SENTENCE
      # THAT STOOD HERE WAS STALE (R1230): it read "against this job's 30-minute
      # budget with 15 minutes of headroom", and by then Round 1229 had put a
      # syscall census on the suite and spent all of it. A number in prose beside
      # a number in the file is two answers, and this one only ever moved.
      - name: blind-waits (a wait ends on a condition, its budget is named)
        run: >
          cargo run -q --locked --manifest-path tools/blind-waits/Cargo.toml
          --bin blind-waits -- --workspace Cargo.toml

      # R1210 — every package THIS FILE installs is one the build-machine
      # declaration names. The step is here rather than in a job of its own for
      # the reason the one above is: it parses instead of building, measured at
      # 0.05s warm.
      #
      # AND IT RUNS IN CI RATHER THAN ONLY IN THE HOOK, which is the half the
      # sibling declaration gate cannot have: that one asks a machine-wide
      # program no runner holds, while this one reads two files in this
      # checkout. A law whose only reader is a local hook is a law that stops
      # existing the day somebody commits with `--no-verify` (N37 is the open
      # debt of exactly that shape).
      - name: what this workflow installs is what the build machine is told
        run: >
          cargo run -q --locked --manifest-path tools/undeclared-requirement/Cargo.toml
          --bin undeclared-requirement -- --repo .

      # R1092 — what this job compiled, for `twice-compiled` to join with every
      # other job's. `always()` because a job that failed still compiled
      # everything up to the point it failed, and a missing log would have the
      # gate report an absence on top of the real failure. `if-no-files-found:
      # error` is a second, independent guard on the same silence the gate's own
      # law covers: a job that recorded nothing must not upload nothing quietly.
      - name: Keep what this job compiled
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rustc-log-${{ github.job }}
          path: rustc-log/
          if-no-files-found: error

  # R1276 — EVERY PATH THIS SUITE READS OUTSIDE THIS TREE, CENSUSED IN A JOB OF
  # ITS OWN.
  #
  # WHY A JOB. R1229 put this census inside `validate`, wrapping that job's
  # longest step, and gave one reason for not giving it a job: "a separate job
  # would compile the whole workspace again, which is the duplication
  # `tools/twice-compiled` exists to forbid". That gate forbids no such thing.
  # Its own header says the duplication is "REPORTED rather than refused,
  # because the number is what licenses the repair"; what it refuses is a job
  # that compiles and leaves no record, one that records counts and no seconds,
  # and one with a cache that did not say what the cache brought. Seven jobs in
  # this file build this workspace while it passes. The sentence was never
  # asked of the machine.
  #
  # WHAT IT COST WHILE IT STOOD THERE. R1275 measured it: about sixty per cent
  # on the suite step — the same tests run slower, `tests/all.rs` 856 s → 1369 s
  # while its test count went 374 → 377, and the workspace's other `tests/all.rs`
  # +163% with its 42 unchanged. And the observer was inside the measurement:
  # six rounds of instrument (R1245, R1260, R1261, R1270, R1274, R1275) read
  # `validate`'s budget share, and under the tracer that share was mostly
  # tracer. The noise moved further than the level — coefficient of variation
  # 3.8% (n=4) to 10.7% (n=26), spread 151 s → 832 s.
  #
  # SO THE DUPLICATION IS THE POINT AND IS PAID FOR DELIBERATELY. This job
  # compiles what `validate` compiles and runs what `validate` runs. That is
  # visible in `twice-compiled`'s report as duplication, which is the honest
  # place for it — the alternative was a tracer hidden inside the number this
  # repository uses to watch its own cost.
  #
  # NO CACHE OF ITS OWN, and that is a decision with two reasons rather than an
  # omission. The 10 GB this repository is given is nearly spent (`cache-budget`
  # is the gate that says so), and a job that restores nothing has a CONSTANT
  # cache state — which makes its duration comparable across runs without the
  # control variable `twice-compiled`'s header spends four paragraphs on. It
  # costs a cold fetch and compile every push, and cost is what this job is
  # explicitly not optimising.
  #
  # ITS VERDICT IS THIS JOB'S, which is the attribution that was missing. A
  # reach found here used to turn `validate` red — the same colour as a failing
  # test, a failing clippy and a failing store validation — and `ci-state` now
  # names the job and the step that ended it.
  outside-reach:
    name: what this run reads outside this tree
    runs-on: ubuntu-latest
    # THE SAME 90 AND THE SAME ARGUMENT AS `validate` CARRIED WHILE IT HELD
    # THIS: an upper bound argued from the other jobs rather than measured on a
    # runner, because a job that runs out of minutes is a red CI nobody can read
    # a result from. The traced suite has been observed at 29m32s inside
    # `validate`; this job adds a cold compile and no cache to restore, and the
    # first runs under this number are what measure it.
    timeout-minutes: 90
    env:
      MNEMOSYNE_RUSTC_LOG: ${{ github.workspace }}/rustc-log/outside-reach.log
    steps:
      - uses: actions/checkout@v7
        with:
          # R889, and it applies here for the same reason it applies to
          # `validate`: this job runs that suite, and the evidence-replay
          # declaration gates in it resolve pinned historical commits that a
          # shallow clone does not have.
          fetch-depth: 0

      # R1229 — `strace` is not in the runner image: checked against
      # `actions/runner-images`' own Ubuntu 24.04 readme, where it appears in no
      # section. The census this job takes is what needs it, and
      # `tools/undeclared-requirement` requires a package CI installs to be
      # named in `.claude/remote-build.toml`, which this one is.
      #
      # R1276 — AND THIS IS NOW THE ONLY JOB IN THIS FILE THAT FETCHES FROM AN
      # ARCHIVE AT ALL, which is where the arc below lands. R1252 removed
      # `protobuf-compiler` from six jobs when the schema compiler became a
      # crate; this step is what was left, and it is here rather than on the
      # push-critical job. On 2026-08-19 four consecutive runs of `main` died in
      # this step — the last of them WITH R1251's retries — and the measurement
      # that came out of it is that a fetch you do not make is the only one that
      # cannot stall. `validate` now makes none.
      #
      # R1236 — BOUNDED, AND THE BOUND IS MEASURED. On 2026-08-18 this step in
      # `server-features` did not fail: it STALLED, for 45m09s, until the job's
      # own 45-minute timeout killed it. Every step behind it was then skipped,
      # and what a reader saw was a job `cancelled` after forty-five minutes,
      # which is also exactly what the change being pushed hanging the job would
      # look like. The same step on the previous green run of the same job took
      # TWELVE SECONDS. Five minutes is twenty-five times the measured cost and
      # still fails well before the job's own bound, so a stalled archive is a
      # named step rather than a whole job's budget spent on nothing.
      #
      # R1251 — the retries and the timeout live in `.github/apt-retries.conf`,
      # copied in first, with the reasoning and the numbers in that file, once.
      - name: Install strace (the outward-reach census)
        timeout-minutes: 5
        run: |
          sudo cp .github/apt-retries.conf /etc/apt/apt.conf.d/99-mnemosyne
          sudo apt-get update
          sudo apt-get install -y strace

      - name: Install rust toolchain (rust-toolchain.toml)
        # R1237 — `rustup show` DOWNLOADS the toolchain when it is not already
        # there, so this is a network fetch and not a report. See `validate`'s
        # copy of this step, and `bounded_fetch_steps.rs` for the law.
        timeout-minutes: 5
        run: rustup show

      # R1092 — the recorder cannot record its own build: it does not exist yet,
      # and an empty `RUSTC_WRAPPER` is how cargo is told there is none. This is
      # the ONE step in a job excused from recording, and `tools/twice-compiled`
      # derives that excuse from the manifests these lines name rather than from
      # a list of jobs.
      #
      # NO `restored` HERE, unlike every other job's copy of this step: that
      # instrument reports what a cache restore put on disk, and this job takes
      # no cache. R1118's rule is the one that still binds — a program a job
      # RUNS must not live under a path a cache restore can overwrite — and with
      # no cache at all there is nothing that could.
      - name: Build the instruments
        env:
          RUSTC_WRAPPER: ""
          # RELATIVE AND NOT `${{ github.workspace }}/instruments`, for R1117's
          # reason: a GitHub expression makes a step unreplayable, and putting
          # one here took all nine jobs out of the local replay's census at once.
          CARGO_TARGET_DIR: instruments
        run: |
          cargo build --release -q --locked --manifest-path tools/rustc-log/Cargo.toml
          cargo build --release -q --locked --manifest-path tools/outside-reach/Cargo.toml

      # WHY IT COSTS NOTHING ON DISK: `strace -o "|program"` hands the trace to
      # the reader through a PIPE. Measured on this repository's whole suite —
      # 611 MB passes through and ZERO bytes are written, against the 2.8 GB
      # across 155,072 files that Round 1228 wrote when it took the same census
      # into files and recorded that as the price of asking.
      #
      # RELATIVE, AND NOT `${{ github.workspace }}`, for R1117's reason: a
      # GitHub expression in a step's script makes the whole job unreplayable,
      # and `tools/twice-compiled` refuses a census that cannot replay it. The
      # first draft of this step wrote the expression and took `validate`
      # straight out of that census — the gate said so by name. Every step in
      # this file runs with the checkout root as its working directory, so
      # `$PWD` is the same path and a local replay can resolve it.
      #
      # `%file` IS THE REQUIREMENT AND NARROWING IT IS THE TRAP: the sibling
      # checkout is reached by `newfstatat` — cargo asking whether a path
      # dependency's directory is THERE, never opening it — so a census watching
      # `openat` answers zero, and zero is what a hermetic tree looks like.
      # `%process` is the other half: a Rust test is a thread, and only the
      # clone lines lead a reach back to the binary that made it.
      # `status=successful` is the one free cut — a failed call reached nothing.
      #
      # R1233 — AND THE SEVEN BY NAME, WHICH IS WIDENING RATHER THAN NARROWING.
      # None of `close`, `close_range`, `dup`, `dup2`, `dup3`, `fchdir`, `fcntl`
      # takes a filename, so none is in `%file`; without them a descriptor NUMBER
      # can be re-pointed where the reader cannot see it, and the model that
      # resolves `openat(3, "…")` would answer WRONG instead of UNKNOWN. Named
      # individually rather than as `%desc`, which would add every `read` and
      # `write` the run makes. THE COST IS MEASURED, not assumed — the numbers
      # are in R1233's ledger entry beside the resolution they bought.
      #
      # `fcntl` IS THE ONE NOBODY WOULD HAVE GUESSED, and it was not guessed:
      # the census reported its residue by kind and by example, and the example
      # was `newfstatat(5, "src")` from a `find(1)` that had reached 5 through
      # `fcntl(4, F_DUPFD_CLOEXEC, 3)` — which is how `fdopendir`, and so every
      # tree walk, gets its descriptor.
      #
      # `--cwd` is the one fact about a run its own syscalls never state. Every
      # step in this file runs with the checkout root as its working directory,
      # so `$PWD` is what the traced command starts in — and without it every
      # bare name (`cd /etc && cat hostname`) is unresolvable.
      #
      # THROUGH `scripts/verify.sh`, the same wrapper `validate` runs the suite
      # through (R1196): a target that fails to COMPILE stops cargo whatever
      # `--no-fail-fast` says, and the wrapper holds the log against what cargo
      # says the command compiles, so a run that covered less than it looks like
      # says so. A census taken over a suite that quietly stopped early is a
      # census of a shorter run.
      - name: cargo test --workspace, censused
        run: >
          strace -f -qq
          -e trace=%file,%process,close,close_range,dup,dup2,dup3,fchdir,fcntl
          -e status=successful
          -o "|./instruments/release/outside-reach
          --repo \"$PWD\" --build \"$PWD/target\"
          --fixture \"${TMPDIR:-/tmp}\" --cwd \"$PWD\"
          > \"${TMPDIR:-/tmp}/outside-reach.txt\" 2>&1;
          echo \$? > \"${TMPDIR:-/tmp}/outside-reach.rc\""
          ./scripts/verify.sh --no-fresh --label ci-census --
          cargo test --workspace --locked --no-fail-fast

      # THE READER'S VERDICT IS READ FROM A FILE, and that is a requirement
      # rather than a style. `strace` returns the WRAPPED command's status and
      # says nothing at all about the program on the other end of its `-o` pipe,
      # so a census that failed would leave the step above green. This
      # repository has paid for reading a wrapper's exit code instead of the
      # one that matters; the file is what cannot be forged.
      #
      # `if: always()` because the census is about the run that HAPPENED. A
      # suite that went red still read whatever it read, and a reach that only
      # appears on a failing run is exactly the one nobody would otherwise see.
      # R1230 — AND THE READING IS THE PROGRAM'S, not four lines of shell. This
      # step was `verdict=$(cat …); exit "$verdict"`, and the first hosted run
      # measured what that costs: the job hit its budget, was CANCELLED before
      # the reader wrote anything, and `exit ""` failed with a message about
      # `exit`. A census that never answered and a census that answered `no` came
      # out of this step looking the same — including for the one question this
      # gate has open, whether `ptrace` attaches on a runner at all.
      #
      # `|| true` ON THE `cat` AND NOT ON THE VERDICT: the census's own prose is
      # worth printing when it exists and is not the thing that decides, so its
      # absence must not mask the program's answer below it.
      - name: what that run read outside this repository
        if: always()
        run: |
          cat "${TMPDIR:-/tmp}/outside-reach.txt" || true
          ./instruments/release/outside-reach --verdict-of "${TMPDIR:-/tmp}/outside-reach.rc"

      # R1092 — what this job compiled, for `twice-compiled` to join with every
      # other job's. `always()` because a job that failed still compiled
      # everything up to the point it failed, and a missing log would have the
      # gate report an absence on top of the real failure.
      - name: Keep what this job compiled
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rustc-log-${{ github.job }}
          path: rustc-log/
          if-no-files-found: error

  # R1077 pointed rustdoc at this workspace for the first time and gave the
  # `[`foo`]` citation the gate `validate-code-refs` gives `Round NNN`. It ran
  # `cargo doc --workspace`, and R1078 measured what that reaches: 25 of this
  # workspace's 136 targets. Not one of the 106 test targets — R1076 had just
  # shipped a citation to a `searchable` named `spelled` inside one — and not a
  # binary whose name collides with its package's library, which is how
  # `crates/mnemosyne-cli/src/main.rs` carried a `DisclosureReveal` that exists
  # nowhere while the gate reported exit 0. Both were live on the commit that
  # shipped the first gate.
  #
  # `tools/item-citations` documents every target cargo lists, asks a test
  # target's own harness for the names rustdoc structurally cannot see
  # (a `#[test]` item is expanded away outside test mode), and REPORTS WHAT IT
  # REACHED — because a gate that never opened a target and a gate that found
  # nothing wrong in it print the same thing.
  #
  # ITS OWN JOB rather than a step in `validate`, and that is measured: the
  # `cargo doc` step it replaces cost 6m49s of that job's 21m40s against a
  # 30-minute budget, and this does five times the documenting. Run beside
  # `validate` it costs wall-clock nothing and carries its own budget; run
  # inside it, it would be the thing that eventually turns the whole gate red by
  # running out of minutes.
  item-citations:
    name: item citations name items
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MNEMOSYNE_RUSTC_LOG: ${{ github.workspace }}/rustc-log/item-citations.log
      # R1101 — see `validate`'s copy of this variable.
      MNEMOSYNE_RESTORED: ${{ github.workspace }}/rustc-log/item-citations.restored
    steps:
      - uses: actions/checkout@v7

      - name: Install rust toolchain (rust-toolchain.toml)
        # R1237 — `rustup show` DOWNLOADS the toolchain when it is not already
        # there, so this is a network fetch and not a report. Measured on the
        # last fully green run: 8 to 10 seconds. See `validate`'s `apt-get` step
        # for why five minutes, and `bounded_fetch_steps.rs` for the law.
        timeout-minutes: 5
        run: rustup show

      # R1092 — the recorder cannot record its own build: it does not exist yet,
      # and an empty `RUSTC_WRAPPER` is how cargo is told there is none. This is
      # the ONE step in a job excused from recording, and `tools/twice-compiled`
      # derives that excuse from the manifests these lines name rather than from
      # a list of jobs, so it stays one step wide. R1101 put the restore measure
      # here too: an instrument's own build is not a cost CI pays for this
      # repository's sake, and counting it would put the instrument inside its
      # own reading. What it costs is two crates with no dependencies — the
      # reason neither has any.
      - name: Build the instruments
        env:
          RUSTC_WRAPPER: ""
          # R1118 — OUTSIDE THE TREE ANY CACHE HOLDS, and this is a repair rather
          # than tidiness. `unrun-tests` caches `target`, and its restore runs
          # AFTER this step: the 8.90 GB that arrives overwrites the binaries
          # this step just built with the previous generation's. R1117 changed
          # the record format and that job died — `restored before` wrote a line
          # that `restored after`, a DIFFERENT PROGRAM by then, refused to read.
          # It is the only job that caches a build directory and the only one
          # that failed, which is what named the mechanism.
          #
          # WORSE THAN THE RED RUN: nothing had changed the format before, so the
          # same substitution had been silent every run. `RUSTC_WRAPPER` points
          # at one of these binaries, so that job's whole compilation census was
          # taken by whatever the last generation's cache happened to hold.
          # `tools/twice-compiled` now refuses a program a job runs after a
          # restore that lives under a path the cache holds.
          CARGO_TARGET_DIR: instruments
        run: |
          cargo build --release -q --locked --manifest-path tools/rustc-log/Cargo.toml
          cargo build --release -q --locked --manifest-path tools/restored/Cargo.toml

      # NO ROOT `target` — see the `validate` job's cache for the measurement.
      # The key is unchanged on purpose: a renamed key leaves the old one held
      # and declared by nothing, which `tools/cache-budget` calls an orphan for
      # the seven days it takes to age out.
      # R1101 — see `validate`'s copy of these two steps.
      - name: What is on disk before the cache is restored
        run: >
          ./instruments/release/restored before
          --cache 'Linux-cargo-citations-'
          '~/.cargo/registry' '~/.cargo/git'

      # ONE JOB HOLDS THE BUILD DIRECTORY AND IT IS NOT THIS ONE. R1112 made
      # every workspace compile into one tree, and this job's cache — which used
      # to hold only its own 0.08 GB tool tree — then held the whole of it, 1.20
      # GB of very nearly the same archive `unrun-tests` already stores. Three
      # copies came to 11.87 GB against a 10 GB budget and GitHub began evicting.
      # A cache keyed by a PATH stores one copy per job, so the arithmetic allows
      # exactly one build directory in this repository, and it is `unrun-tests`'s.
      - name: Cache cargo (item citations)
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-citations-${{ hashFiles('**/Cargo.lock', '.github/workflows/mnemosyne-validate.yml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-citations-

      - name: What the cache restored
        env:
          MNEMOSYNE_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: ./instruments/release/restored after

      - name: every item citation in the workspace names an item
        run: >
          cargo run -q --locked --manifest-path tools/item-citations/Cargo.toml
          --bin item-citations -- --workspace Cargo.toml

      # R1092 — see `validate`'s copy of this step.
      - name: Keep what this job compiled
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rustc-log-${{ github.job }}
          path: rustc-log/
          if-no-files-found: error

  # R1062 built an instrument nothing ran. This repository has four SEPARATE
  # workspaces (`bench/`, `studio/`, `tools/*`) which carry their own
  # `[workspace]` so the root gates never compile them — deliberate, and it left
  # their tests run only when a person remembered. When this job was written two
  # of the four were already rotted: `studio/` did not compile at all and
  # `bench/` had 6 failing tests. Nothing had failed, because nothing had asked.
  #
  # The script is the single source for WHICH are run and why the rest are not,
  # so a person runs exactly what this job runs, and every skip prints its
  # reason. This job installed nothing on purpose — none of these workspaces
  # builds `mnemosyne-server`, and a job that installs what it does not need
  # hides the day it starts needing it. Since R1252 that is no longer a
  # DIFFERENCE from the other jobs: none of them installs a compiler either.
  side-workspaces:
    name: separate in-repo workspaces
    runs-on: ubuntu-latest
    # R1067 — 60 rather than the 30 the other jobs carry, because this one's
    # cost changed under it. Its first run took 28 SECONDS: `bench` and `studio`
    # were both skipped and only the two tool workspaces were built. `bench` is
    # in it now — five crates over RocksDB and sled — and it is checked twice,
    # once by clippy and once by the test build. Measured cold at four cores
    # (the runner's count) on the machine this was written on: 4m11s for the
    # test build alone, and a hosted core is slower than that machine's. A job
    # that runs out of budget is a red CI nobody can read a result from, and the
    # minutes are free on a public repository.
    #
    # ITS ARTIFACTS ARE DELIBERATELY NOT CACHED, and that is measured too: the
    # four workspaces' `target` directories come to 3.9 GB, against a 10 GB
    # per-repository cache that the `validate` job's own cache already lives in.
    # Caching these would evict that one, trading a job that rebuilds for a job
    # that rebuilds AND a slower one beside it.
    timeout-minutes: 60
    env:
      MNEMOSYNE_RUSTC_LOG: ${{ github.workspace }}/rustc-log/side-workspaces.log
      # R1101 — see `validate`'s copy of this variable.
      MNEMOSYNE_RESTORED: ${{ github.workspace }}/rustc-log/side-workspaces.restored
    steps:
      - uses: actions/checkout@v7

      - name: Install rust toolchain (rust-toolchain.toml)
        # R1237 — `rustup show` DOWNLOADS the toolchain when it is not already
        # there, so this is a network fetch and not a report. Measured on the
        # last fully green run: 8 to 10 seconds. See `validate`'s `apt-get` step
        # for why five minutes, and `bounded_fetch_steps.rs` for the law.
        timeout-minutes: 5
        run: rustup show

      # R1092 — the recorder cannot record its own build: it does not exist yet,
      # and an empty `RUSTC_WRAPPER` is how cargo is told there is none. This is
      # the ONE step in a job excused from recording, and `tools/twice-compiled`
      # derives that excuse from the manifests these lines name rather than from
      # a list of jobs, so it stays one step wide. R1101 put the restore measure
      # here too: an instrument's own build is not a cost CI pays for this
      # repository's sake, and counting it would put the instrument inside its
      # own reading. What it costs is two crates with no dependencies — the
      # reason neither has any.
      - name: Build the instruments
        env:
          RUSTC_WRAPPER: ""
          # R1118 — OUTSIDE THE TREE ANY CACHE HOLDS, and this is a repair rather
          # than tidiness. `unrun-tests` caches `target`, and its restore runs
          # AFTER this step: the 8.90 GB that arrives overwrites the binaries
          # this step just built with the previous generation's. R1117 changed
          # the record format and that job died — `restored before` wrote a line
          # that `restored after`, a DIFFERENT PROGRAM by then, refused to read.
          # It is the only job that caches a build directory and the only one
          # that failed, which is what named the mechanism.
          #
          # WORSE THAN THE RED RUN: nothing had changed the format before, so the
          # same substitution had been silent every run. `RUSTC_WRAPPER` points
          # at one of these binaries, so that job's whole compilation census was
          # taken by whatever the last generation's cache happened to hold.
          # `tools/twice-compiled` now refuses a program a job runs after a
          # restore that lives under a path the cache holds.
          CARGO_TARGET_DIR: instruments
        run: |
          cargo build --release -q --locked --manifest-path tools/rustc-log/Cargo.toml
          cargo build --release -q --locked --manifest-path tools/restored/Cargo.toml

      # R1101 — see `validate`'s copy of these two steps.
      - name: What is on disk before the cache is restored
        run: >
          ./instruments/release/restored before
          --cache 'Linux-cargo-side-'
          '~/.cargo/registry' '~/.cargo/git'

      - name: Cache cargo (side workspaces)
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-side-${{ hashFiles('bench/Cargo.lock', 'tools/*/Cargo.lock', '.github/workflows/mnemosyne-validate.yml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-side-

      - name: What the cache restored
        env:
          MNEMOSYNE_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: ./instruments/release/restored after

      - name: fmt, clippy and test in every separate in-repo workspace
        run: ./scripts/check-side-workspaces.sh

      # R1092 — see `validate`'s copy of this step. This job's compilations reach
      # the recorder through a shell script rather than a `run:` cargo line, and
      # that is the reason the recorder is an environment variable: a child
      # process inherits it, so what the script builds is recorded without the
      # script knowing anything about this.
      - name: Keep what this job compiled
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rustc-log-${{ github.job }}
          path: rustc-log/
          if-no-files-found: error

  # R1081 — the targets `cargo test --workspace` compiles to NOTHING.
  #
  # `mnemosyne-server` declares `default = []` and puts its TLS and OTLP
  # surfaces behind `tls` and `otlp`. Every test file for them opens with
  # `#![cfg(feature = ...)]`, so under the workspace suite this repository has
  # been running since R583 they are empty crates. Measured on the commit that
  # added this job, from that suite's own output: SIX integration test targets
  # reported `running 0 tests` — `grpc_tls_smoke`, `grpc_mtls_smoke`,
  # `grpc_otlp_smoke`, `grpc_otlp_collector_e2e`, `grpc_otlp_config_smoke` and
  # `grpc_otlp_sampling_zero_smoke`. Nine tests, none of which had ever run in
  # CI, and four of R1081's blind waits lived in them: a 50ms `sleep` under the
  # comment "tiny grace" survives indefinitely when nothing executes it.
  #
  # `--all-features` rather than the two named, so a feature added tomorrow is
  # covered without anybody remembering this file. `-p mnemosyne-server` rather
  # than `--workspace`, because feature unification across the whole workspace
  # rebuilds far more than the crate under test for no added coverage.
  #
  # Measured before it was written down: 354.9s wall and 1.43 GiB peak RSS on
  # this project's 32-core machine, INCLUDING a cold librocksdb-sys build. A
  # hosted core is slower and there are four of them, hence 45 rather than 30.
  server-features:
    name: the server targets the workspace suite compiles to nothing
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MNEMOSYNE_RUSTC_LOG: ${{ github.workspace }}/rustc-log/server-features.log
      # R1101 — see `validate`'s copy of this variable.
      MNEMOSYNE_RESTORED: ${{ github.workspace }}/rustc-log/server-features.restored
    steps:
      - uses: actions/checkout@v7

      - name: Install rust toolchain (rust-toolchain.toml)
        # R1237 — `rustup show` DOWNLOADS the toolchain when it is not already
        # there, so this is a network fetch and not a report. Measured on the
        # last fully green run: 8 to 10 seconds. See `validate`'s `apt-get` step
        # for why five minutes, and `bounded_fetch_steps.rs` for the law.
        timeout-minutes: 5
        run: rustup show

      # R1092 — the recorder cannot record its own build: it does not exist yet,
      # and an empty `RUSTC_WRAPPER` is how cargo is told there is none. This is
      # the ONE step in a job excused from recording, and `tools/twice-compiled`
      # derives that excuse from the manifests these lines name rather than from
      # a list of jobs, so it stays one step wide. R1101 put the restore measure
      # here too: an instrument's own build is not a cost CI pays for this
      # repository's sake, and counting it would put the instrument inside its
      # own reading. What it costs is two crates with no dependencies — the
      # reason neither has any.
      - name: Build the instruments
        env:
          RUSTC_WRAPPER: ""
          # R1118 — OUTSIDE THE TREE ANY CACHE HOLDS, and this is a repair rather
          # than tidiness. `unrun-tests` caches `target`, and its restore runs
          # AFTER this step: the 8.90 GB that arrives overwrites the binaries
          # this step just built with the previous generation's. R1117 changed
          # the record format and that job died — `restored before` wrote a line
          # that `restored after`, a DIFFERENT PROGRAM by then, refused to read.
          # It is the only job that caches a build directory and the only one
          # that failed, which is what named the mechanism.
          #
          # WORSE THAN THE RED RUN: nothing had changed the format before, so the
          # same substitution had been silent every run. `RUSTC_WRAPPER` points
          # at one of these binaries, so that job's whole compilation census was
          # taken by whatever the last generation's cache happened to hold.
          # `tools/twice-compiled` now refuses a program a job runs after a
          # restore that lives under a path the cache holds.
          CARGO_TARGET_DIR: instruments
        run: |
          cargo build --release -q --locked --manifest-path tools/rustc-log/Cargo.toml
          cargo build --release -q --locked --manifest-path tools/restored/Cargo.toml

      # Its own key, because this build resolves different features than
      # `validate`'s and a shared key would hold whichever job saved first.
      #
      # NO ROOT `target`, and that supersedes what this comment used to argue.
      # It said sharing a key would evict the other job's artifacts, which is
      # true of cargo and was true of the three comments beside it — and the six
      # of them together asked for 63 GB of a 10 GB budget, so GitHub evicted all
      # of it instead. This job is 14m24s cold, under the 20m14s floor
      # `separate in-repo workspaces` sets. See `validate`'s cache.
      # R1101 — see `validate`'s copy of these two steps.
      - name: What is on disk before the cache is restored
        run: >
          ./instruments/release/restored before
          --cache 'Linux-cargo-serverfeat-'
          '~/.cargo/registry' '~/.cargo/git'

      - name: Cache cargo (server features)
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-serverfeat-${{ hashFiles('**/Cargo.lock', '.github/workflows/mnemosyne-validate.yml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-serverfeat-

      - name: What the cache restored
        env:
          MNEMOSYNE_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: ./instruments/release/restored after

      # LINT IT TOO, and that is not symmetry for its own sake: the first time
      # anything linted this build it found a `MutexGuard` held across an await
      # in `grpc_otlp_config_smoke.rs` — a deadlock shape that never bit only
      # because the code it is in had never been compiled by a gate. The
      # workspace clippy above cannot see it: `--all-targets` still resolves
      # `default = []`.
      - name: cargo clippy -p mnemosyne-server --all-features
        run: >
          cargo clippy -p mnemosyne-server --all-features --all-targets
          --locked -- -D warnings

      # R1196 — see `validate`'s suite for why the wrapper is here.
      - name: cargo test -p mnemosyne-server --all-features
        run: >
          ./scripts/verify.sh --no-fresh --label ci-server-features --
          cargo test -p mnemosyne-server --all-features --locked --no-fail-fast

      # R1092 — see `validate`'s copy of this step.
      - name: Keep what this job compiled
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rustc-log-${{ github.job }}
          path: rustc-log/
          if-no-files-found: error

  # R1084 — the level above `server-features`. That job exists because six test
  # targets compiled to nothing; R1082 then gated the general form of WHY they
  # were dark (a feature nobody compiles). Compiling is not running: an
  # `--all-features` build keeps passing after every test behind those features
  # is deleted, and an `#[ignore]` nobody ever passes `--ignored` for is a test
  # that exists and that nothing executes.
  #
  # This asks both sides of the machine. POPULATION: for every workspace the
  # lister says this machine can build, `cargo test --workspace --all-features
  # --no-run`, then each test binary's own `--list`, plus `--doc` for the tests
  # that have no binary. RUN: every `cargo test` this repository's workflows and
  # its workspace lister issue, re-run with `--list` appended to ITS OWN harness
  # arguments, minus what that command leaves `#[ignore]`d.
  #
  # ITS OWN JOB, for the reason `item-citations` has one: it compiles every
  # workspace twice over, once as CI configures it and once with every feature.
  #
  # THE BUDGET IS AN UPPER BOUND ARGUED FROM THE OTHER JOBS, not a number this
  # round measured on a runner — it has run only on a 32-core machine, where it
  # takes 71s fully warm. What it builds is strictly more than either of the two
  # jobs that build: everything `validate` compiles (30 minutes, and it has used
  # 20) plus everything `separate in-repo workspaces` compiles (60 minutes, and
  # it has used 19), plus an `--all-features` resolve of each, which is a
  # different resolve and therefore a different build. 90 is the sum with room;
  # the minutes are free on a public repository and a job that runs out of them
  # is a red CI nobody can read a result from.
  #
  # Its first run found eleven, and every one was real: nine tests disabled in
  # Round 252 against a document model Round 400 deleted, an `#[ignore]`d proof
  # whose own header wrote out the command nobody ran, and a `​```ignore` doc
  # example that no compiler had ever read.
  unrun-tests:
    name: every test compiled is one CI runs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MNEMOSYNE_RUSTC_LOG: ${{ github.workspace }}/rustc-log/unrun-tests.log
      # R1122 — AND NO `MNEMOSYNE_RESTORED` HERE, which every other job in this
      # file does declare. THIS job is the one the measurement was built for: it
      # is the only one holding a whole build tree, and it is the one Round 1099
      # deleted for saving nothing. A record is one CACHE's since R1117, and this
      # job now declares TWO — so the path cannot be the job's, and each
      # measuring pair carries its own. `tools/twice-compiled` asks for the
      # variable on the steps that MEASURE rather than on every step, which is
      # what makes a job-level value right for the six jobs with one cache and
      # impossible for this one.
    steps:
      - uses: actions/checkout@v7

      - name: Install rust toolchain (rust-toolchain.toml)
        # R1237 — `rustup show` DOWNLOADS the toolchain when it is not already
        # there, so this is a network fetch and not a report. Measured on the
        # last fully green run: 8 to 10 seconds. See `validate`'s `apt-get` step
        # for why five minutes, and `bounded_fetch_steps.rs` for the law.
        timeout-minutes: 5
        run: rustup show

      # R1092 — the recorder cannot record its own build: it does not exist yet,
      # and an empty `RUSTC_WRAPPER` is how cargo is told there is none. This is
      # the ONE step in a job excused from recording, and `tools/twice-compiled`
      # derives that excuse from the manifests these lines name rather than from
      # a list of jobs, so it stays one step wide. R1101 put the restore measure
      # here too: an instrument's own build is not a cost CI pays for this
      # repository's sake, and counting it would put the instrument inside its
      # own reading. What it costs is two crates with no dependencies — the
      # reason neither has any.
      - name: Build the instruments
        env:
          RUSTC_WRAPPER: ""
          # R1118 — OUTSIDE THE TREE ANY CACHE HOLDS, and this is a repair rather
          # than tidiness. `unrun-tests` caches `target`, and its restore runs
          # AFTER this step: the 8.90 GB that arrives overwrites the binaries
          # this step just built with the previous generation's. R1117 changed
          # the record format and that job died — `restored before` wrote a line
          # that `restored after`, a DIFFERENT PROGRAM by then, refused to read.
          # It is the only job that caches a build directory and the only one
          # that failed, which is what named the mechanism.
          #
          # WORSE THAN THE RED RUN: nothing had changed the format before, so the
          # same substitution had been silent every run. `RUSTC_WRAPPER` points
          # at one of these binaries, so that job's whole compilation census was
          # taken by whatever the last generation's cache happened to hold.
          # `tools/twice-compiled` now refuses a program a job runs after a
          # restore that lives under a path the cache holds.
          CARGO_TARGET_DIR: instruments
        run: |
          cargo build --release -q --locked --manifest-path tools/rustc-log/Cargo.toml
          cargo build --release -q --locked --manifest-path tools/restored/Cargo.toml

      # Its own key: this job resolves `--all-features` for the whole workspace,
      # which is neither `validate`'s resolve nor `server-features`', so sharing
      # a cache would make each run evict the other's artifacts.
      #
      # R1100 — THE BUILD TREE IS BACK, AND NOW IT HAS A NUMBER BEHIND IT. R1099
      # removed it on the strength of two runs whose censuses for this job were
      # identical (773 compiled / 670 distinct / 103 repeated), reading that as a
      # cache which skipped nothing. Both of those runs were WARM. The exact key
      # missed in one of them because the workflow had moved, but `restore-keys`
      # matched the prefix and GitHub served the previous generation — its own log
      # says `Cache hit for restore-key: Linux-cargo-unrun-…`. Comparing warm
      # against warm is how a cache that works reads as a cache that does nothing.
      #
      # Run 31296883662 is the one that was actually cold here, because the tree
      # was not in the declaration at all, and it says what the cache is worth:
      # 1199 compiled / 1006 distinct / 193 repeated, against 773 / 670 / 103 —
      # 426 compilations and about 600 seconds of this job. It costs 7.83 GB of a
      # 10 GB budget and 135 seconds to restore, and it buys ten minutes.
      #
      # THE LESSON IS R1091'S, MIRRORED. That round established that a cache which
      # EXISTS is not a job that was warm. This one is the other direction: a run
      # whose key MOVED is not a job that was cold. `restore-keys` is exactly the
      # mechanism that makes both true, and the only reading that settles it is
      # the one printed per job by `cache-budget` — whether a cache was built from
      # nothing — which R1099 did not consult for this key.
      # R1101 — THE MEASUREMENT THIS PARAGRAPH WAS MISSING. Everything above is a
      # reading of two runs' job durations and censuses held side by side by a
      # person; what follows measures, per run and on this job's own disk,
      # whether a tree arrived at all. See `validate`'s copy of these two steps.
      #
      # R1122 — TWO CACHE STEPS WHERE THERE WAS ONE, and the reason is that the
      # question GG1b asks has no answer while there is one. This job's single
      # step held `~/.cargo/registry`, `~/.cargo/git` AND `target`, so the
      # interval it cost was the price of all three at once — and the registry
      # half is separately known to be overwhelmingly worth having (756 MB in
      # 5.4 s against 381.4 s of compiling in `validate`). Charging the whole
      # interval to the build directory is the arithmetic R1099 got wrong when it
      # deleted a cache that was saving ten minutes. One archive also cannot be
      # made cold on its own: taking a path out of `path:` does not stop an
      # archive unpacking as it was stored.
      #
      # THE BUILD DIRECTORY KEEPS THE OLD KEY, and that asymmetry is a constraint
      # rather than a preference. A renamed key leaves its archive held and
      # declared by nothing, which `tools/cache-budget` refuses as an orphan for
      # the seven days it takes to age out — so a split may rename at most one of
      # its halves, and the half worth keeping warm is the 8.90 GB one.
      #
      # NEITHER PREFIX IS A PREFIX OF THE OTHER, which is what stops one cache's
      # `restore-keys` serving the other's archive: `Linux-cargo-unruntests-home-`
      # and `Linux-cargo-unrun-` first differ at the character after `unrun`.
      - name: What is on disk before the cargo home is restored
        env:
          MNEMOSYNE_RESTORED: ${{ github.workspace }}/rustc-log/unrun-tests.cargo-home.restored
        run: >
          ./instruments/release/restored before
          --cache 'Linux-cargo-unruntests-home-'
          '~/.cargo/registry' '~/.cargo/git'

      - name: Cache cargo (unrun tests, cargo home)
        id: cache-home
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-unruntests-home-${{ hashFiles('**/Cargo.lock', '.github/workflows/mnemosyne-validate.yml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-unruntests-home-

      - name: What the cargo home restored
        env:
          MNEMOSYNE_RESTORED: ${{ github.workspace }}/rustc-log/unrun-tests.cargo-home.restored
          MNEMOSYNE_CACHE_HIT: ${{ steps.cache-home.outputs.cache-hit }}
        run: ./instruments/release/restored after

      - name: What is on disk before the build directory is restored
        env:
          MNEMOSYNE_RESTORED: ${{ github.workspace }}/rustc-log/unrun-tests.build-directory.restored
        run: >
          ./instruments/release/restored before
          --cache 'Linux-cargo-unrun-'
          'target'

      # R1160 — AND THIS ONE DECLARES NO `restore-keys`, ALONE IN THIS FILE. Run
      # 31599893855 refused the repository at 10.75 GB of declared caches against
      # GitHub's 10.00 GB, with this key alone at 9.95 GB of it, and the
      # mechanism is the fallback that used to sit here.
      #
      # A FALLBACK IS INHERITANCE. `actions/cache` writes an archive only when
      # the PRIMARY key missed — that run printed `Cache hit occurred on the
      # primary key …, not saving cache` for both of this job's caches — so the
      # only run that writes is the run whose key moved, and by then the fallback
      # has already unpacked the previous generation onto the disk about to be
      # saved. What gets written is the union, every time, forever: 7.83 GB at
      # R1091 and 9.95 GB here, with `path:` never once changing.
      #
      # MEASURED, NOT REASONED: this cache put 37,427 MB on the runner, and a
      # clean build of everything this job compiles is 3.86 GB (`cargo test
      # --workspace --all-features --no-run` plus `tools/unrun-tests`, same
      # `CARGO_INCREMENTAL` and `CARGO_PROFILE_DEV_DEBUG`, into an empty tree).
      # NINE TENTHS OF THE BUDGET'S LARGEST ITEM IS IN NO BUILD AT ALL.
      #
      # WHAT IT COSTS, AND IT IS A REAL COST: every edit to this file or to a
      # lockfile is now a cold run FOR THIS CACHE, which is exactly the licence
      # `survives_an_edit` protects for the six that keep their fallback. Their
      # union is bounded — a cargo home holds one entry per crate version some
      # lockfile named — and this one's is not, so the two halves get different
      # laws. `no_cache_here_inherits_a_tree_nothing_bounds` in
      # `tools/ci-plan/tests/reading.rs` is what keeps this true.
      - name: Cache cargo (unrun tests, build directory)
        id: cache-tree
        uses: actions/cache@v6
        with:
          path: |
            target
          key: ${{ runner.os }}-cargo-unrun-${{ hashFiles('**/Cargo.lock', '.github/workflows/mnemosyne-validate.yml') }}

      - name: What the build directory restored
        env:
          MNEMOSYNE_RESTORED: ${{ github.workspace }}/rustc-log/unrun-tests.build-directory.restored
          MNEMOSYNE_CACHE_HIT: ${{ steps.cache-tree.outputs.cache-hit }}
        run: ./instruments/release/restored after

      - name: every test this repository compiles is one some CI command runs
        run: >
          cargo run -q --locked --manifest-path tools/unrun-tests/Cargo.toml
          --bin unrun-tests

      # R1092 — see `validate`'s copy of this step.
      - name: Keep what this job compiled
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rustc-log-${{ github.job }}
          path: rustc-log/
          if-no-files-found: error

  # The level above `unrun-tests`, and the hole that job named in itself. Its
  # population is what cargo COMPILES, so a test in a file cargo never opens is
  # missing from its population and from its run set at the same time — two
  # absences that cancel into a clean report. Measured, not argued: with
  # `autotests = false` added to `crates/mnemosyne-atomic/Cargo.toml`, three
  # test files and the eight tests in them leave every build, and `unrun-tests`
  # still says `every test this repository compiles is run by CI`, 2150 of 2150.
  #
  # Both sides are asked of the machine. TRACKED: `git ls-files '*.rs'` — a file
  # git does not track is not this repository's and a checkout does not have it.
  # COMPILED: for every workspace the lister says this machine can build,
  # `cargo check --workspace --all-targets`, once with `--all-features` and once
  # without, then the files each compilation READ out of rustc's own dep-info.
  # Dep-info rather than a walk over `mod` declarations, because this repository
  # already holds the file that breaks a walker: `codegen-prototype`'s golden
  # fixture is reached only through `include!(concat!(env!(…)))`.
  #
  # ITS OWN JOB, for the reason `unrun-tests` has one: it resolves every
  # workspace twice, which is neither resolve any other job caches.
  #
  # THE BUDGET IS AN UPPER BOUND ARGUED FROM THE OTHER JOBS, not a number
  # measured on a runner — it takes 11s fully warm on a 32-core machine, which
  # says nothing about a cold one. `cargo check` skips the codegen and linking
  # that `unrun-tests` pays for (27 minutes of its 90), and then doubles because
  # a second feature resolve is a second dependency graph, C dependencies
  # included. 90 is that product with room; a job that runs out of minutes is a
  # red CI nobody can read a result from, and the first run is what measures it.
  uncompiled-sources:
    name: every file tracked is one cargo compiles
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MNEMOSYNE_RUSTC_LOG: ${{ github.workspace }}/rustc-log/uncompiled-sources.log
      # R1101 — see `validate`'s copy of this variable.
      MNEMOSYNE_RESTORED: ${{ github.workspace }}/rustc-log/uncompiled-sources.restored
    steps:
      - uses: actions/checkout@v7

      - name: Install rust toolchain (rust-toolchain.toml)
        # R1237 — `rustup show` DOWNLOADS the toolchain when it is not already
        # there, so this is a network fetch and not a report. Measured on the
        # last fully green run: 8 to 10 seconds. See `validate`'s `apt-get` step
        # for why five minutes, and `bounded_fetch_steps.rs` for the law.
        timeout-minutes: 5
        run: rustup show

      # R1092 — the recorder cannot record its own build: it does not exist yet,
      # and an empty `RUSTC_WRAPPER` is how cargo is told there is none. This is
      # the ONE step in a job excused from recording, and `tools/twice-compiled`
      # derives that excuse from the manifests these lines name rather than from
      # a list of jobs, so it stays one step wide. R1101 put the restore measure
      # here too: an instrument's own build is not a cost CI pays for this
      # repository's sake, and counting it would put the instrument inside its
      # own reading. What it costs is two crates with no dependencies — the
      # reason neither has any.
      - name: Build the instruments
        env:
          RUSTC_WRAPPER: ""
          # R1118 — OUTSIDE THE TREE ANY CACHE HOLDS, and this is a repair rather
          # than tidiness. `unrun-tests` caches `target`, and its restore runs
          # AFTER this step: the 8.90 GB that arrives overwrites the binaries
          # this step just built with the previous generation's. R1117 changed
          # the record format and that job died — `restored before` wrote a line
          # that `restored after`, a DIFFERENT PROGRAM by then, refused to read.
          # It is the only job that caches a build directory and the only one
          # that failed, which is what named the mechanism.
          #
          # WORSE THAN THE RED RUN: nothing had changed the format before, so the
          # same substitution had been silent every run. `RUSTC_WRAPPER` points
          # at one of these binaries, so that job's whole compilation census was
          # taken by whatever the last generation's cache happened to hold.
          # `tools/twice-compiled` now refuses a program a job runs after a
          # restore that lives under a path the cache holds.
          CARGO_TARGET_DIR: instruments
        run: |
          cargo build --release -q --locked --manifest-path tools/rustc-log/Cargo.toml
          cargo build --release -q --locked --manifest-path tools/restored/Cargo.toml

      # Its own key: two feature resolves of every workspace, which no other job
      # holds, so a shared key would hold whichever job saved first.
      #
      # NO ROOT `target` AND NO `bench/target` — the two heaviest things it used
      # to keep, and the ones the four rounds before R1090 each added without
      # re-adding the total. This job is 14m43s cold, under the 20m14s floor.
      # See `validate`'s cache.
      # R1101 — see `validate`'s copy of these two steps.
      - name: What is on disk before the cache is restored
        run: >
          ./instruments/release/restored before
          --cache 'Linux-cargo-uncompiled-'
          '~/.cargo/registry' '~/.cargo/git'

      # See `item-citations`' cache: one job holds the build directory, and the
      # arithmetic that says so is the 10 GB budget divided by its size.
      - name: Cache cargo (uncompiled sources)
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-uncompiled-${{ hashFiles('**/Cargo.lock', '.github/workflows/mnemosyne-validate.yml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-uncompiled-

      - name: What the cache restored
        env:
          MNEMOSYNE_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: ./instruments/release/restored after

      - name: every Rust file this repository tracks is one cargo compiles
        run: >
          cargo run -q --locked --manifest-path tools/uncompiled-sources/Cargo.toml
          --bin uncompiled-sources

      # R1092 — see `validate`'s copy of this step.
      - name: Keep what this job compiled
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rustc-log-${{ github.job }}
          path: rustc-log/
          if-no-files-found: error

  msrv:
    name: MSRV (workspace.package.rust-version)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MNEMOSYNE_RUSTC_LOG: ${{ github.workspace }}/rustc-log/msrv.log
      # R1101 — see `validate`'s copy of this variable.
      MNEMOSYNE_RESTORED: ${{ github.workspace }}/rustc-log/msrv.restored
    steps:
      - uses: actions/checkout@v7

      # Verify the declared MSRV actually compiles. The version is read from
      # Cargo.toml (single source — no drift with rust-version). rust-toolchain.toml
      # pins the newer *dev* toolchain; RUSTUP_TOOLCHAIN overrides it so this job
      # builds on the MSRV itself (dev-on-latest, support-down-to-MSRV).
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          echo "version=$(grep -oP 'rust-version\s*=\s*"\K[0-9.]+' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Install MSRV toolchain
        # R1237 — see `validate`'s toolchain step. This one is the same fetch
        # said out loud; measured at 10 seconds on the last fully green run.
        timeout-minutes: 5
        run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal

      # ON THE MSRV TOOLCHAIN, unlike the other jobs' copies of this step: this
      # job installs only that one, and building the instruments on the dev
      # toolchain would make rustup fetch a second one for two crates with no
      # dependencies. Both declare the same `rust-version` the workspace does, so
      # the MSRV compiles them by construction.
      - name: Build the instruments
        env:
          RUSTC_WRAPPER: ""
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
          # Outside the tree any cache holds — see `validate`'s copy.
          CARGO_TARGET_DIR: instruments
        run: |
          cargo build --release -q --locked --manifest-path tools/rustc-log/Cargo.toml
          cargo build --release -q --locked --manifest-path tools/restored/Cargo.toml

      # R1101 — see `validate`'s copy of these two steps.
      - name: What is on disk before the cache is restored
        run: >
          ./instruments/release/restored before
          --cache 'Linux-cargo-msrv-'
          '~/.cargo/registry' '~/.cargo/git'

      # NO ROOT `target`: this job is 6m54s cold, the cheapest in the file, and
      # it was one of the six holding a whole build tree. See `validate`'s cache.
      - name: Cache cargo (MSRV)
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('**/Cargo.lock', '.github/workflows/mnemosyne-validate.yml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msrv-

      - name: What the cache restored
        env:
          MNEMOSYNE_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: ./instruments/release/restored after

      - name: cargo check --workspace on MSRV
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo check --workspace --locked

      # R1092 — see `validate`'s copy of this step. THIS JOB IS THE CONTROL for
      # the whole census: it runs the same words over the same sources as
      # `validate` does, on a different compiler. cargo's `-C metadata` hash
      # takes in the compiler's version, so its units must come back disjoint
      # from every other job's — and if they did not, the key would be wrong.
      - name: Keep what this job compiled
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rustc-log-${{ github.job }}
          path: rustc-log/
          if-no-files-found: error

  # The level above every cache step in this file, and the constraint four rounds
  # broke without noticing.
  #
  # R1067 measured it and wrote it into `separate in-repo workspaces`: those
  # workspaces' `target` directories come to 3.9 GB "against a 10 GB
  # per-repository cache that the `validate` job's own cache already lives in",
  # and so they are deliberately not cached. Then R1078, R1081, R1084 and R1085
  # each added a job with its OWN whole-`target` key, every one carrying a comment
  # explaining that a shared key would evict the other job's artifacts. Every one
  # of those comments is right about cargo. Nobody re-added the total, which was
  # 63 GB of a 10 GB budget.
  #
  # WHY A GATE AND NOT A COMMENT: it was already a comment.
  #
  # WHY IT IS NOT THE OBVIOUS GATE: summing the caches that exist cannot fail.
  # Eviction holds that total under the limit by construction, so a repository
  # asking three times its budget measures the same as one asking half of it. The
  # law here is ABSENCE — every declared key is one GitHub still holds, and an
  # absent one is priced from the largest present cache holding a SUBSET of its
  # paths — because absence is the thing eviction cannot hide.
  #
  # IT WAITS FOR EVERY JOB THAT SAVES A CACHE, which is what makes it a judgement
  # about the state THIS run leaves rather than about the previous one.
  # `actions/cache` writes in a job's post step, so a gate running beside them
  # reads yesterday's storage. That `needs:` list is a list, and lists go stale —
  # so it is not trusted: `tools/cache-budget`'s own suite reads the jobs that
  # declare a cache out of this file and fails if one of them is missing here.
  #
  # IT TAKES NO CACHE OF ITS OWN, which is the point rather than an oversight, and
  # its suite asserts that too.
  #
  # R1091 — AND IT ASKS THE SECOND QUESTION: not "is this cache held" but "did
  # this run RESTORE it". `actions/cache` saves only when it did not find an exact
  # hit, so a cache whose `created_at` falls inside this run is a job that
  # rebuilt from nothing — green, unannotated, and half an hour long, which is the
  # cost the budget exists to buy off and the one a held-or-not check cannot see.
  # Excused when the key's own `hashFiles` globs moved over the interval that key
  # was last asked over, which is why this checkout needs history to diff against.
  #
  # R1178 — AND THAT INTERVAL IS PER KEY, NOT PER PUSH. A cache key is asked for
  # only when the workflow DECLARING it runs, and `evidence-replay.yml` is
  # path-filtered: between two of its runs the lockfiles its key hashes moved
  # twice, its next run legitimately missed, and this gate — asking only about the
  # commits that push carried — called it a defect and turned main red on run
  # 31695396997. The gate now asks GitHub when each declaring workflow last ran
  # successfully at another commit, which is what `actions: read` below is for.
  cache-budget:
    name: every cache declared is one CI keeps
    needs:
      - validate
      - outside-reach
      - item-citations
      - side-workspaces
      - server-features
      - unrun-tests
      - uncompiled-sources
      - msrv
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MNEMOSYNE_RUSTC_LOG: ${{ github.workspace }}/rustc-log/cache-budget.log
      # R1095 — THE COMMIT THIS PUSH STARTED FROM, because a push carries a range
      # and the gate used to ask about one commit. Two commits went up together,
      # the workflow moved in the FIRST of them, every cache key was legitimately
      # invalidated, and the tip commit had touched none of them — so eight jobs
      # that correctly rebuilt from nothing were reported as a defect and main
      # went red. Empty on a `pull_request`, where the checkout is a merge commit
      # whose first parent is the base branch, so the gate's `HEAD~1..HEAD`
      # fallback is exactly the change the pull request proposes.
      #
      # R1178 — AND IT IS THE FALLBACK NOW, not the interval. A key is judged over
      # the history of the workflow that declares it; this is what the gate
      # narrows to when that history cannot be reached, and it prints which of the
      # two any answer came from.
      MNEMOSYNE_RANGE_FROM: ${{ github.event.before }}
    permissions:
      contents: read
      # The cache list is an Actions read, and it is the only permission beyond
      # the checkout this job takes.
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          # THE WHOLE HISTORY, because the interval this gate asks over reaches
          # back to the last run of each workflow that declares a key — a
          # path-filtered one may not have run in days — and because a push
          # carries an unbounded number of commits besides: every fixed depth is
          # a guess that fails silently the day somebody pushes one commit
          # more. The gate asks git whether anything matching a key's own
          # `hashFiles` globs moved, because a cache rebuilt after a dependency
          # bump is the one cold run nobody should be refused for; a commit the
          # checkout does not hold makes that question unanswerable, and the gate
          # then narrows the range and SAYS SO rather than assuming nothing
          # changed. Cheap here and measured: this repository's pack is 13 MB
          # over 891 commits, against a job that otherwise takes 17 seconds.
          fetch-depth: 0

      - name: Install rust toolchain (rust-toolchain.toml)
        # R1237 — `rustup show` DOWNLOADS the toolchain when it is not already
        # there, so this is a network fetch and not a report. Measured on the
        # last fully green run: 8 to 10 seconds. See `validate`'s `apt-get` step
        # for why five minutes, and `bounded_fetch_steps.rs` for the law.
        timeout-minutes: 5
        run: rustup show

      # R1092 — the recorder cannot record its own build: it does not exist yet,
      # and an empty `RUSTC_WRAPPER` is how cargo is told there is none. This is
      # the ONE step in a job excused from recording, and `tools/twice-compiled`
      # derives that excuse from the manifests these lines name rather than from
      # a list of jobs, so it stays one step wide. R1101 put the restore measure
      # here too: an instrument's own build is not a cost CI pays for this
      # repository's sake, and counting it would put the instrument inside its
      # own reading. What it costs is two crates with no dependencies — the
      # reason neither has any.
      - name: Build the compilation recorder
        env:
          RUSTC_WRAPPER: ""
          # Outside the tree any cache holds — see `validate`'s copy. Neither
          # gate job caches a build directory, so nothing here would be
          # overwritten today; the law is about where a program LIVES rather than
          # about which job happens to cache what, so both jobs answer it the
          # same way and a cache added tomorrow cannot make one of them wrong.
          CARGO_TARGET_DIR: instruments
        run: cargo build --release -q --locked --manifest-path tools/rustc-log/Cargo.toml

      # R1101 — WHAT EACH JOB'S DISK RECEIVED, which is the other half of this
      # gate's question and the half it could not see. `actions/cache` reports
      # `cache-hit: false` for a `restore-keys` prefix match and saves a new
      # archive anyway, so "this key was saved by this run" — the only signal
      # this gate had — describes a job warmed by an earlier generation in the
      # same words as one that compiled from an empty disk. Round 1099 read the
      # first as the second. The records are uploaded by the jobs themselves and
      # joined here.
      #
      # INTO A DIRECTORY OF ITS OWN, and not into `rustc-log/`: this job uploads
      # that directory as its own artifact, so downloading eight other jobs'
      # records into it would upload all of them again under this job's name.
      - name: Collect what every job started from
        uses: actions/download-artifact@v8
        with:
          pattern: rustc-log-*
          merge-multiple: true
          path: collected

      - name: every cache this repository declares is one it keeps
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          cargo run -q --locked --manifest-path tools/cache-budget/Cargo.toml
          --bin cache-budget -- --restored collected

      # R1092 — see `validate`'s copy of this step.
      - name: Keep what this job compiled
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rustc-log-${{ github.job }}
          path: rustc-log/
          if-no-files-found: error

  # R1092 — every compilation this repository's CI pays for is one job's.
  #
  # SEVEN JOBS ABOVE BUILD THIS WORKSPACE, and what has always kept them apart is
  # a sentence: they resolve different features. It is written in four separate
  # comments, none of which counted anything, and the bill for it is visible in
  # the job beside this one — `unrun-tests` holds 7.83 GB of a 10 GB cache budget
  # because a build tree per job is what a job per build tree costs.
  #
  # WHY IT IS FREE. The population is not gathered by building anything: every
  # job already ran `rustc` thousands of times, and `tools/rustc-log` sat in
  # front of each of those and wrote down the invocation. This job downloads
  # what they wrote and joins it. The unit key is cargo's own `-C metadata`
  # fingerprint — the hash it computes from the package, the resolved features,
  # the profile and the compiler's version — so "they resolve differently" is
  # answered by cargo rather than argued here, and `msrv` is the control that
  # shows the key can tell two compilers apart.
  #
  # WHAT IT ASSERTS TODAY is that it reached every job, and that every job it
  # reached left a clock behind — a log with counts and no seconds says the work
  # is free, which is the finding this report exists to make. The duplication
  # itself is REPORTED and not yet refused: the number is what licenses the
  # repair, and there is no honest limit to assert before the repair exists.
  # R1090 shipped a gate whose limit was a prediction and it was wrong by a
  # factor of two.
  #
  # IT WAITS FOR EVERY OTHER JOB, and that list is not trusted:
  # `tools/twice-compiled`'s own suite reads the jobs out of this file and fails
  # if one of them is missing here.
  twice-compiled:
    name: every compilation is one job's
    needs:
      - validate
      - outside-reach
      - item-citations
      - side-workspaces
      - server-features
      - unrun-tests
      - uncompiled-sources
      - msrv
      - cache-budget
    # NO `if: always()`, deliberately. A job that was SKIPPED because something
    # it needed failed uploads no log, and this gate cannot tell that from a job
    # whose recorder is unwired — it would report a finding about a job that
    # never ran, on a run that already has a real failure to read. So the census
    # is of a complete run, which is the same scope `cache-budget` takes.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MNEMOSYNE_RUSTC_LOG: ${{ github.workspace }}/rustc-log/twice-compiled.log
    steps:
      - uses: actions/checkout@v7

      - name: Install rust toolchain (rust-toolchain.toml)
        # R1237 — `rustup show` DOWNLOADS the toolchain when it is not already
        # there, so this is a network fetch and not a report. Measured on the
        # last fully green run: 8 to 10 seconds. See `validate`'s `apt-get` step
        # for why five minutes, and `bounded_fetch_steps.rs` for the law.
        timeout-minutes: 5
        run: rustup show

      # R1092 — the recorder cannot record its own build: it does not exist yet,
      # and an empty `RUSTC_WRAPPER` is how cargo is told there is none. This is
      # the ONE step in a job excused from recording, and `tools/twice-compiled`
      # derives that excuse from the manifests these lines name rather than from
      # a list of jobs, so it stays one step wide. R1101 put the restore measure
      # here too: an instrument's own build is not a cost CI pays for this
      # repository's sake, and counting it would put the instrument inside its
      # own reading. What it costs is two crates with no dependencies — the
      # reason neither has any.
      - name: Build the compilation recorder
        env:
          RUSTC_WRAPPER: ""
          # Outside the tree any cache holds — see `validate`'s copy. Neither
          # gate job caches a build directory, so nothing here would be
          # overwritten today; the law is about where a program LIVES rather than
          # about which job happens to cache what, so both jobs answer it the
          # same way and a cache added tomorrow cannot make one of them wrong.
          CARGO_TARGET_DIR: instruments
        run: cargo build --release -q --locked --manifest-path tools/rustc-log/Cargo.toml

      - name: Collect what every job compiled
        uses: actions/download-artifact@v8
        with:
          pattern: rustc-log-*
          merge-multiple: true
          path: rustc-log

      - name: every compilation this repository's CI pays for is one job's
        run: >
          cargo run -q --locked --manifest-path tools/twice-compiled/Cargo.toml
          --bin twice-compiled -- rustc-log
