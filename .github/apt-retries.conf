// Round 1251 — what apt does when a mirror will not answer, in ONE place.
//
// THIS FILE IS THE REASON THE STEPS ARE PLAIN. Every job that needs protoc runs
// `apt-get update` and `apt-get install`, six times over, and R1236 bounded each
// of those steps at five minutes after two of them sat on a single `apt-get` for
// 45 and 90 minutes. The bound worked and then it fired for real: on 2026-08-19
// the same step timed out at five minutes on two runs two and a half hours
// apart, and the jobs after it died with `exit code 127` looking for a protoc
// that was never installed. A bound turns a hang into a red build faster; it
// cannot turn it into a green one.
//
// What was missing is that apt was asked to try ONCE. Both defaults are why:
// `Acquire::Retries` is 0, so a fetch that fails is the end of the run, and
// `Acquire::http::Timeout` is 120 seconds, so a handful of stalled connections
// spends the whole five minutes before anything is retried. Three retries at
// twenty seconds turns the same stall into a few seconds of noise.
//
// THE NUMBERS ARE CHOSEN, WITH ONE MEASUREMENT BEHIND THEM: on the last fully
// green run these steps took 9 to 18 seconds end to end, so twenty seconds is
// already longer than a healthy fetch of the whole index takes, and three tries
// of it fit inside the five-minute bound with room for the install itself.
//
// It lives here, tracked, and each step COPIES it, rather than being spelled
// into six `-o` flags: `ci_plan::read_command` refuses an apt command with
// anything between the manager and `install`, on purpose — a reader that cannot
// see what a step installs is a hole in the population that judges what CI
// installs against what the build machines declare. Configuration belongs in
// apt's configuration, and the step stays the plain form a program can read.
Acquire::Retries "3";
Acquire::http::Timeout "20";
