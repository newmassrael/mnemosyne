# 이 저장소를 빌드 머신에서 어떻게 검증하는가.
#
# `remote-build` 스킬이 읽는다. 머신 이름은 여기 없다 — 요구사항만 적고, 어느
# 머신이 그걸 만족하는지는 스킬이 실행 시점에 물어서 고른다. pc3 가 생겨도 이
# 파일은 그대로다.

# 추적 파일 + .git 만 보낸다. 이 저장소의 `claudedocs/` 는 gitignore 이고 아직
# 전달되지 않은 외부 소비자 회신 문서를 담고 있어서, 다른 머신으로 조용히 넘어갈
# 이유가 없다.
#
# `target` 을 막는 것도 이 줄이다. 그것은 `~/.buildcache/mnemosyne` 를 가리키는
# 심볼릭 링크라서 보내면 원격에 깨진 링크로 가는데, 추적 파일이 아니므로 애초에
# 전송 목록에 오르지 않는다.
send = "tracked"

# 여기 `exclude = ["/target"]` 이 있었고, 2026-08-14 에 지웠다. **bx 에 그 키의
# 추출자가 없다** — 다섯 저장소가 전부 그것을 선언하고 있는데 아무도 읽지 않는다
# (`packages` 가 네 저장소에서 그랬던 것과 같은 모양이고, 그때는 새 빌드 머신이
# 헤더 하나 없어 죽고 나서야 드러났다). 위의 `target` 보호는 `send = "tracked"`
# 가 하던 일이었고 이 키가 한 일은 없다. 요구사항처럼 읽히면서 아무것도 강제하지
# 않는 줄은 안전 장치가 아니라 안전하다는 착각이다.
#
# 이 종류를 다시 조용히 쓰지 못하게 하는 것이 `tools/unread-declaration` 이다 —
# 이 파일의 모든 top-level 키를 bx 자신에게 물어(`--explain-declaration`) 읽히는지
# 대조하고, 안 읽히면 커밋을 거부한다.

# `protoc` 은 `mnemosyne-server` 의 build.rs 가 prost-build 로 부르는 것이고, 없으면
# 크레이트 269개를 컴파일한 뒤에야 `Could not find protoc` 로 죽는다 — 2026-08-14 에
# pc3 에서 실측했다. 이것이 선언에 없던 이유가 기록해 둘 만하다: R1188 이 예산을
# 고쳐 함대를 하나에서 셋으로 늘리기 전까지 이 저장소는 pc2 밖으로 나간 적이 없고,
# pc2 는 그것을 갖고 있었다. **함대가 커지자 불완전한 선언이 처음 드러났다.**
needs = ["cargo", "protoc"]

# `librocksdb-sys` 의 bindgen 이 clang 내장 헤더를 요구한다. `libclang.so` 만으로는
# 부족하고, 없으면 `'stdbool.h' file not found` 로 죽는다 (2026-08-12, Ubuntu
# 24.04 빌드 머신에서 실측).
#
# `protobuf-compiler` 는 위 `protoc` 의 설치 이름이다. 둘 다 적는 이유는 검사가
# 다르기 때문이다 — `needs` 는 「돌아가는가」를, `packages` 는 「무엇을 깔면 되는가」를
# 답한다.
packages = ["libclang-common-18-dev", "protobuf-compiler"]

# `min_ram_gb` 는 일부러 없다. 기계 총 RAM 은 이 저장소가 물어야 할 질문이 아니고,
# 실제로 막는 것은 아래 `peak_gb_per_task` 다 — bx 는 `가용 RAM < peak` 인 호스트를
# 후보에서 뺀다.
#
# 그리고 크게 잡으면 해롭다. 2026-08-14 에 48 을 넣어 보고 되돌렸다: 30 GB 짜리
# 빌드 머신이 후보에서 빠지는데, 후보가 하나도 없으면 bx 는 **로컬로 떨어지고**
# 로컬은 이 스위트가 실제로 죽은 그 기계다(가용 21 GB, 스왑 14 GB 사용 중). 느린
# 것을 막으려다 위험한 쪽으로 떨어뜨리는 선언은 안전 장치가 아니다.
min_free_gb = 20

# 이 저장소의 명령 중 **트리를 쓰는** 것들. bx 는 이것들을 원격으로 안 보낸다.
#
# bx 의 내장 어휘는 *도구*(git·cargo·mnemosyne mutate API)를 안다 — 그건 누가
# 돌리든 쓰기니까. 저장소 자신의 스크립트는 알 수 없고, 바로 거기서 사고가 났다:
# 2026-08-15(R1208), `bx -- cargo fmt` 가 **빌드 머신의 사본만 포맷하고 exit 0** 을
# 냈다. 로컬 트리는 안 고쳐진 채였고, 그다음 사이드 게이트가 매니페스트 네 개를
# unformatted 로 잡고서야 드러났다. **초록 종료코드를 쓴 조용한 무동작**이다.
#
# `cargo fmt` 자체는 bx 가 이제 안다(`--check` 가 없으면 쓰기). 여기 있는 것은 bx 가
# 원리적으로 알 수 없는 쪽 — 이 저장소의 스크립트다.
#
#   scripts/fmt.sh   R1206 이 만든 **유일한** 포맷 명령. 게이트의 `--list` 에서
#                    모집단을 유도하므로, 검사하는 것과 고치는 것이 같은 집합이다.
#   .sweep.json      주입 스윕이 `*.firings.json`(추적되는 증거)을 쓴다. Z28 의 첫
#                    발화가 이것이었다 — 주입 하나를 재증명했더니 기록이 pc2 에 남고
#                    돌아오지 않았다.
#
# ⚠**판별자는 도구 이름이 아니라 「스윕 매니페스트를 지목하는가」다.** 처음엔
# `injection-harness` 라고 적었는데, 그건 부분문자열이라 그 크레이트의 **스위트**
# (`cargo test --manifest-path tools/injection-harness/Cargo.toml`, 읽기만 한다)까지
# 로컬로 끌어당긴다 — 로컬이 스왑에 14 GB 물려 있는 기계인데. 쓰는 형태만이
# `<…>.sweep.json` 을 인자로 지목하므로 그것이 실제 판별자다.
#
# 검사 방법: `bx --explain-declaration` 이 이 키를 인쇄하고,
# `tools/unread-declaration` 이 매 커밋 그 답과 이 파일을 맞댄다.
writes = ["scripts/fmt.sh", ".sweep.json"]

# 병렬도는 여기 적지 않는다 — 스킬이 코어 수와 동시 실행 수로 계산한다. 이건 이
# 저장소의 **작업 하나**가 쥐는 RAM 이고, bx 는 이 값으로 (ㄱ)호스트 후보 자격과
# (ㄴ)`by_ram = 가용 / peak` 스레드 예산을 정한다.
#
# **측정한 값이다.** 2026-08-14, 빌드 머신(32코어 / 125 GB), 워밍 빌드,
# `/usr/bin/time -v`, `--test-threads 1`:
#
#   전 워크스페이스 스위트  최대 RSS 1,603,380 kB = 1.53 GiB, 15분 29초, 스왑 0, exit 0
#   `authoring_surface` 하나  최대 RSS   732,320 kB = 0.70 GiB,  3분 20초, 스왑 0
#
# 2 는 그 위의 여유다. `--test-threads 1` 이라 이 수치는 **한 작업의 몫**이고, 그것이
# bx 가 곱하는 단위다.
#
# 그리고 새 값이 사는 폭에서 한 번 더 재봤다 — 선언을 고치면 이 저장소가 실제로
# 받게 되는 스레드 수가 바뀌므로, 그 폭에서 초록인지는 별개의 사실이다. 같은 기계,
# `RUST_TEST_THREADS=28`:
#
#   전 워크스페이스 스위트  최대 RSS 819,756 kB = 0.78 GiB, 9분 32초, exit 0, 실패 0
#
# 28개를 동시에 돌리는데 최대 RSS 가 1-스레드 때보다 **낮다**. 즉 `peak × 스레드` 는
# 실제 사용량을 과대평가하는 방향으로 틀린 모델이고, 그쪽이 안전한 방향이다. 속도는
# 15분 29초 -> 9분 32초 (1.63배).
#
# 왜 24 였고 왜 그것이 틀렸나. 24 는 Round 1076 이 `authoring_surface` 한 테스트에서
# 본 23.9 GiB 에서 왔는데, **그 수치를 만든 것은 테스트의 결함이었고 그 결함은 그때
# 고쳐졌다** — `.cargo/config.toml` 의 주석이 그렇게 적어 두었다. 고쳐진 것은 코드이고
# 그 코드가 만든 숫자는 여기 예산 선언으로 남아 살아남았다. 그 대가는 조용했다:
# 2026-08-14 실측에서 가용 20 GB 짜리 빌드 머신이 `20 < 24` 로 **후보에서 빠졌고**,
# 125 GB 기계도 `113/24 = 4` 스레드로 묶여 있었다. 낡은 안전 여유는 안전이 아니라
# 함대 축소로 나타난다.
#
# 이 값은 **양쪽을 다 묶는다** — 2026-08-15(R1212)에 실측해서 고친 문장이다. 여기
# 적혀 있던 것은 「이것은 실행(테스트) 쪽 수치이고 컴파일 쪽은 `.cargo/config.toml` 의
# `jobs = 4` 가 따로 묶는다」였는데, **프로그램은 그렇게 하지 않는다**: bx 는 이 예산에서
# 유도한 같은 수를 `RUST_TEST_THREADS` 와 `CARGO_BUILD_JOBS` **둘 다로** 내보낸다
# (원격에서 `printenv` 실측: 둘 다 31). 즉 컴파일 폭도 이 숫자가 정하고 있었고, 그 사실을
# 아무도 적어 두지 않았다. 선언이 자기를 강제하는 프로그램과 어긋난 채 살아 있던 자리다.
#
# 그래서 컴파일 쪽 한 작업의 몫도 실측했다. 빌드 머신(32코어/125GB), 워크스페이스 전체
# **콜드** 빌드(233 크레이트), `/usr/bin/time -v`, `NUM_JOBS=31`:
#
#   최대 RSS 777,424 kB = **0.74 GiB**, 46.07초, 스왑 0, exit 0
#
# `/usr/bin/time -v` 의 최대 RSS 는 «가장 무거운 한 프로세스»이므로 이것이 곧 rustc 한
# 작업의 몫이다. 테스트 쪽(한 작업 0.70 GiB, 전 스위트 1.53 GiB)과 나란히 놓으면 **2 는
# 양쪽 모두의 상한으로 유효**하다 — 고칠 값이 아니라 고칠 문장이었다.
#
# ⚠**「폭」을 명령에 쓰지 마라.** 실측(R1212, 신선한 빌드 디렉터리 세 arm): 설정 파일 4 →
# 환경변수 8 → 명령줄 `-j 2` 는 2. 명령줄이 환경변수를 이긴다 ⇒ 어느 스크립트든 `-j` 나
# `--test-threads` 를 적으면 이 예산이 정하는 폭을 **조용히** 무력화한다. 그것을 막는 법이
# `crates/mnemosyne-cli/tests/build_width.rs` 이고, 모집단은 이 저장소가 내는 cargo 명령
# 231개(9개 출처)다.
peak_gb_per_task = 2

# R1197 — 이 셋은 「이 저장소가 내는 cargo 명령」인데 오랫동안 어느 법의 모집단에도
# 없었다. `tools/unread-declaration` 이 매 커밋 「commands.* 는 프로그램의 네임스페이스
# 밖이라 판정하지 않는다」고 인쇄해 왔고, 그것은 **그 독자**에 대한 참인 문장인데
# **모든 독자**에 대한 한계로 잘못 읽혔다. 이 줄들은 이 저장소의 추적 파일에 적힌
# cargo 명령이므로, 이 저장소 자신의 법이 물을 수 있는 대상이다. 법이 보이자마자
# 셋 다 결함이었다 — `--locked` 가 하나도 없었고(어긋난 락파일을 보고가 아니라
# 재작성한다), test 둘은 커버리지 판정 밖이었다.
#
# `--no-fresh`: 원격 트리의 신선도는 bx 가 자기 `--fresh` 로 이미 소유한 질문이고
# (겹친 실행 뒤에만 켜는 opt-in), 여기에 두 번째 `cargo clean` 을 쌓으면 그 플래그가
# 선택으로 존재하는 의미가 없어진다.
[commands]
build = "scripts/verify.sh --no-fresh --label bx-build -- cargo test --workspace --locked --no-run"
verify = "scripts/verify.sh --no-fresh --label bx-verify -- cargo test --workspace --locked --no-fail-fast"

# 주입 스윕 — 계약이 공허하지 않은지 증명한다. 컨트롤 1회 + 주입 16회이고 매번
# 전체 스위트를 돌리므로 오래 걸린다. 32코어 / 125 GB 머신에서 테스트 실행만
# 런당 389초 실측.
sweep = "cargo run -q --locked --manifest-path tools/injection-harness/Cargo.toml -- crates/mnemosyne-cli/sweeps/citation-path-scope.sweep.json"
