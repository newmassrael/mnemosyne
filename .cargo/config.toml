# Parallelism, bounded — because this machine's scarce resource is memory, not
# cores, and nothing here was asking it how much it had.
#
# WHAT HAPPENED. Round 1076 ran one test of `authoring_surface` and the process
# reached 23.9 GiB resident with 24.2 GiB more in swap, on a host with 31 GiB of
# RAM and 32 GiB of swap that is shared with sibling checkouts (`pinion`,
# `scxml-core-engine`) running their own sessions. Swap went to 100% full and
# every other process on the box slowed with it. The run was killed at 22m33s,
# having finished nothing.
#
# The defect that produced THAT number was in the test and is repaired there.
#
# AND THE REPAIR HAS BEEN MEASURED, because a number this large outlives the
# defect that made it and gets read as a standing fact about this repository —
# `.claude/remote-build.toml` carried 23.9 GiB forward as a memory budget until
# 2026-08-14, and it was excluding a whole build machine from the fleet. On the
# build machine, warm, under `/usr/bin/time -v` at `--test-threads 1`: that one
# test now peaks at 732,320 kB (0.70 GiB), and the WHOLE workspace suite peaks
# at 1,603,380 kB (1.53 GiB) in 15m29s with zero swapping. Whoever reads the
# paragraph above next should read this one with it.
#
# What this file is about is the multiplier that stood behind it: cargo defaults
# `jobs` to the CPU count and libtest defaults its thread count the same way, so
# on 32 cores both were 32. Neither had ever been told what the memory budget
# was, so neither could stay inside it, and a single crate that grows heavy at
# compile time or a single test that grows heavy at run time gets multiplied by
# thirty-two before anyone sees a number.
#
# THE NUMBER IS FOUR, and it is not new here: Round 1067 measured a cold `-j4`
# build of the `bench` workspace at 250.7 seconds and that is the width the
# side-workspace gate has used since. Reusing it keeps one answer to "how wide
# may this repository build" rather than inventing a second constant beside it.
# Four rustc processes at the one-to-two GiB a heavy crate reaches leave room for
# a sibling checkout to be doing the same thing, which is the actual operating
# condition rather than the ideal one.
#
# AND IT IS A DEFAULT, NOT A BOUND ON EVERY MACHINE — R1212 measured what this
# file had never been asked. A number here is a fact about ONE host and it
# travels with the tree to every checkout, so the question is whether it GOVERNS
# there. Three arms, each with a fresh build directory so the build script that
# reads cargo's own `NUM_JOBS` actually ran:
#
#   this config alone                     NUM_JOBS = 4
#   CARGO_BUILD_JOBS=8 against it         NUM_JOBS = 8
#   `-j 2` against that variable          NUM_JOBS = 2
#
# So it governs exactly where nothing else decides — this workstation, and a CI
# runner, neither of which has a scheduler in front of it. On the build machine
# it does not: `bx` exports a per-host width and a full cold workspace build
# there ran at `NUM_JOBS=31`, in 46.07s at 1874% CPU with zero swapping, its
# heaviest single process peaking at 777,424 kB (0.74 GiB). That measurement is
# also the compile side's per-task cost, which nothing had ever measured — see
# `.claude/remote-build.toml`'s `peak_gb_per_task`.
#
# The third arm is why `crates/mnemosyne-cli/tests/build_width.rs` exists: a flag
# beats the environment, so a `-j` written into any command this repository
# issues would take the width away from every scheduler at once, silently.
#
# BOTH DEFAULTS, NOT ONE. `jobs` bounds the compile side; `RUST_TEST_THREADS`
# bounds the run side, which is where the memory in this repository actually
# lives — `authoring_surface` is one binary holding twelve tests over a shared
# sweep (Round 1071), and running twelve of those at once multiplies whatever
# each one holds. `[env]` here does not override a value already in the
# environment, so `RUST_TEST_THREADS=1 cargo test` and `-- --test-threads=N`
# both still win, and CI may raise it where the runner is the one being sized.

[build]
jobs = 4
target-dir = "target"

[env]
RUST_TEST_THREADS = "4"
