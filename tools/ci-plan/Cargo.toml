[package]
name = "ci-plan"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Mnemosyne — the one answer to what this repository's CI runs, shared by every gate that asks"
keywords = ["ci", "workflow", "gate"]
categories = ["development-tools"]

# A MEMBER OF THE ROOT WORKSPACE, unlike its neighbours under `tools/`, and that
# is forced rather than chosen: cargo makes a path dependency living inside a
# workspace directory a member of that workspace, so a crate the root workspace
# dev-depends on cannot also carry its own `[workspace]`. Its consumers are a
# root test target and a separate-workspace gate, and a package can be a member
# of one workspace while being a path dependency of another.

[dependencies]
toml = { workspace = true }
yaml-rust2 = { workspace = true }
# Round 1256 — the fifth place a cargo command is written is a JSON array: the
# `test_command` of every tracked injection-sweep manifest. See
# `sweep_cargo_commands`.
serde_json = { workspace = true }
# Round 1262 — the SIXTH place is a Rust program's own `.arg()` chain, and there
# the words are computed rather than written down. `syn` answers off the same
# tree the compiler reads, which is the only thing that can tell a spawn from a
# comment naming one; `quote` renders what a site hands over at runtime;
# `proc-macro2` carries the line. See `rust`.
syn = { workspace = true }
quote = { workspace = true }
proc-macro2 = { workspace = true }

[lints]
workspace = true
