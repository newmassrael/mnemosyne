[workspace]

[package]
name = "cache-budget"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
description = "Mnemosyne — every cache this repository's CI declares is one it gets to keep"
keywords = ["ci", "cache", "gate"]
categories = ["development-tools"]

# ITS OWN WORKSPACE, like every other gate under `tools/`: a separate program with
# its own dependency tree, because compiling a gate into the tree it judges is how
# a gate starts depending on what it is checking.
#
# `ci-plan` is a path dependency reaching INTO the root workspace, which is the
# one direction that works — cargo makes a path dependency living inside a
# workspace a member of it, so the shared reader belongs to the root and is
# borrowed here. This gate asks it what the workflows DECLARE; `unrun-tests` asks
# the same crate what they RUN. Two questions, one reader, no drift.

[dependencies]
ci-plan = { path = "../ci-plan" }
# R1101 — what a job's DISK received after its restore, which is the question
# this gate's own signals cannot answer: `actions/cache` reports `cache-hit:
# false` for a `restore-keys` prefix match, and a job warmed by one still saves a
# new archive, which is what this gate reads as a key built from nothing. The
# format of that record is written down once, in the crate that writes it.
restored = { path = "../restored" }
# R1130 — GitHub's answer is READ here rather than projected by `gh`. What this
# gate holds against the workflows arrives as JSON, and the `--jq` expression
# that used to flatten it into tab-separated rows was a program written in a
# language nothing in this repository can run in a test: there is no `jq` on this
# machine, and `gh` itself needs a network and a credential. So the ONE seam
# between this gate and the storage it judges had no oracle at all, and the count
# GitHub prints beside its rows — the only thing in the answer that says whether
# the rows are all of them — was thrown away before this program saw it.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# THE ENTRANCE TESTS BUILD REPOSITORIES, one per answer this gate can give, and
# each has to be somewhere `git init` is harmless and cleanup is automatic. The
# sibling gates' fixture suites use the same crate for the same reason.
[dev-dependencies]
tempfile = "3"
# R1178 — ONE OF THIS GATE'S LAWS RESTS ON A PROPERTY OF THE WORKFLOWS THEMSELVES:
# a cache key is asked for only when the workflow declaring it runs, and this
# repository has a workflow that does not run on every push. `ci-plan` reads the
# cache steps and hands back the parsed document; the trigger block is read here,
# through the SAME parser, because a premise asserted by matching strings in a YAML
# file is a second reader that can disagree with the first.
yaml-rust2 = "0.11"
# R1181 — THE FIXTURE'S ENVIRONMENT LIST IS CHECKED AGAINST THE BINARY'S SYNTAX.
# A hand-written set of "the variables this program reads" goes stale silently:
# R1178 added two reads, a developer's shell sets neither, and the suite stayed
# green until a runner set both and `main` went red. Asked through the grammar
# rather than by matching text, for the R1172 reason — a name in a comment is not
# a read, and a read spelled across a line break still is one.
syn = { version = "3", features = ["full", "visit"] }

[lints.clippy]
all = "deny"
