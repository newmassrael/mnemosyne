[workspace]

[package]
name = "twice-compiled"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
description = "Mnemosyne — every compilation this repository's CI pays for is one job's"
keywords = ["ci", "cargo", "gate"]
categories = ["development-tools"]

# ITS OWN WORKSPACE, like every other gate under `tools/`. `ci-plan` is a path
# dependency reaching INTO the root workspace, which is the direction that works:
# `cache-budget` asks it what the workflows DECLARE, `unrun-tests` asks it what
# they RUN, and this asks it WHICH JOBS THERE ARE. Three questions, one reader.
#
# `rustc-log` is the wrapper whose records this reads, and the dependency is what
# keeps the format from being written down twice. `restored` is the other record
# every job leaves — what its cache restore put on disk — and it is here for the
# same reason: a census that cannot say what state it was taken in is one nobody
# can compare against another, which is how Round 1099 deleted a cache that was
# saving ten minutes.

[dependencies]
ci-plan = { path = "../ci-plan" }
restored = { path = "../restored" }
rustc-log = { path = "../rustc-log" }

# `tests/replay.rs` builds a whole fixture repository — a workflow, a crate the
# jobs compile, and a copy of the recorder — and the replay it then runs checks
# worktrees out of it. A directory that removes itself is what keeps a suite that
# writes repositories from leaving them behind.
[dev-dependencies]
tempfile = "3"

[lints.clippy]
all = "deny"
