[package]
name = "mnemosyne-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Mnemosyne — markdown spec/doc management infrastructure for LLM-using codebases (CLI for the reference application + generic library)"
keywords = ["markdown", "spec", "documentation", "llm", "validator"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "mnemosyne-cli"
path = "src/main.rs"

[dependencies]
mnemosyne-ops = { path = "../mnemosyne-ops" }
mnemosyne-validate = { path = "../mnemosyne-validate" }
mnemosyne-core = { path = "../mnemosyne-core" }
mnemosyne-config = { path = "../mnemosyne-config" }
mnemosyne-atomic = { path = "../mnemosyne-atomic" }
mnemosyne-style = { path = "../mnemosyne-style" }
mnemosyne-query = { path = "../mnemosyne-query" }
mnemosyne-plugin-tree-sitter-rust = { path = "../mnemosyne-plugin-tree-sitter-rust" }
mnemosyne-plugin-tree-sitter-cpp = { path = "../mnemosyne-plugin-tree-sitter-cpp" }
mnemosyne-plugin-tree-sitter-go = { path = "../mnemosyne-plugin-tree-sitter-go" }
mnemosyne-plugin-tree-sitter-python = { path = "../mnemosyne-plugin-tree-sitter-python" }
mnemosyne-plugin-tree-sitter-kotlin = { path = "../mnemosyne-plugin-tree-sitter-kotlin" }

anyhow.workspace = true
serde = { workspace = true }
# Round 120 — query subcommand JSON envelope output in serde_json (Claude
# consumable shape, Round 117 §15 body registered carry).
serde_json.workspace = true
thiserror.workspace = true
# Round 293 — commit↔ledger drift gate parses commit subjects ("(R<N>)" /
# "(Round <N>)") and atomic ledger entry-id keys via a small fixed pattern set.
regex.workspace = true

# Round 859 — SIGPIPE only. Rust installs SIG_IGN before `main`, so a report
# piped into `head` dies at exit 101 with a `Broken pipe` panic instead of
# ending like `cat` does; restoring the default disposition needs one libc call
# and the unstable `#[unix_sigpipe]` attribute is not an option on stable.
# Unix-gated: `SIGPIPE` does not exist on Windows, and neither does the defect.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
yaml-rust2 = { workspace = true }
# THE one answer to what this repository's CI runs. Shared with the gate in
# `tools/unrun-tests` rather than copied into each — R1083 is what a second
# derivation of it costs.
ci-plan = { path = "../../tools/ci-plan" }
# The ledger tests ask whether an entry id carries a round pin. That question
# already has one answer in production (`project::parse_round_number`, the
# resolver the changelog projection keys on), so the tests borrow it rather
# than re-deciding what a pin looks like.
mnemosyne-atomic = { path = "../mnemosyne-atomic" }
# The backlog walk asks each contract in `tests/` which pair of reads it judges,
# by reading the `const DECLARES` out of its source. See the workspace entry.
syn = { workspace = true }
# The symbol-axis reach contract checks that the report prints the EXTENSION
# TABLE's own range rather than a language list retyped into the command, so it
# needs the library the command reads it from.
mnemosyne-validate = { path = "../mnemosyne-validate" }

[lints]
workspace = true

[build-dependencies]
mnemosyne-build-stamp = { path = "../mnemosyne-build-stamp" }
