[package]
name = "mnemosyne-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Mnemosyne — markdown spec/doc management infrastructure for LLM-using codebases (CLI for the reference application + generic library)"
keywords = ["markdown", "spec", "documentation", "llm", "validator"]
categories = ["command-line-utilities", "development-tools"]
# Round 1172 — the integration tests are ONE binary (`tests/all.rs`) plus the
# exceptions declared below, so cargo must not also pick each file up on its
# own. Without this every file would be built twice. The law that decides which
# file may share the binary, and which exception is earned, is
# `tests/consolidated_test_isolation.rs`.
autotests = false

[[bin]]
name = "mnemosyne-cli"
path = "src/main.rs"

[[test]]
name = "all"
path = "tests/all.rs"

# NAMED BY A CI COMMAND, which is a target that exists to be built alone.
# `evidence-replay.yml` runs each of these with `--test <name>` — the first also
# with `-- --ignored`, the long replay a scheduled job pays for on purpose.
# Folded into `all` they would make that job build every other test file in this
# crate to run one, which is the cost this consolidation exists to remove.
[[test]]
name = "evidence_replay_smoke"
path = "tests/evidence_replay_smoke.rs"

[[test]]
name = "pinned_revision_rechecks_evidence_smoke"
path = "tests/pinned_revision_rechecks_evidence_smoke.rs"

[dependencies]
mnemosyne-ops = { path = "../mnemosyne-ops" }
mnemosyne-validate = { path = "../mnemosyne-validate" }
mnemosyne-core = { path = "../mnemosyne-core" }
mnemosyne-config = { path = "../mnemosyne-config" }
mnemosyne-atomic = { path = "../mnemosyne-atomic" }
mnemosyne-style = { path = "../mnemosyne-style" }
mnemosyne-query = { path = "../mnemosyne-query" }
# Round 1164 — the backend table carries each backend's `LanguageSpec`, so the
# reach report can publish what a backend answers WITH (its declaration-pattern
# count and its doc-comment rule) instead of a consumer reading our source.
mnemosyne-plugin-tree-sitter-core = { path = "../mnemosyne-plugin-tree-sitter-core" }
mnemosyne-plugin-tree-sitter-rust = { path = "../mnemosyne-plugin-tree-sitter-rust" }
mnemosyne-plugin-tree-sitter-cpp = { path = "../mnemosyne-plugin-tree-sitter-cpp" }
mnemosyne-plugin-tree-sitter-go = { path = "../mnemosyne-plugin-tree-sitter-go" }
mnemosyne-plugin-tree-sitter-python = { path = "../mnemosyne-plugin-tree-sitter-python" }
mnemosyne-plugin-tree-sitter-kotlin = { path = "../mnemosyne-plugin-tree-sitter-kotlin" }

anyhow.workspace = true
serde = { workspace = true }
# Round 120 — query subcommand JSON envelope output in serde_json (Claude
# consumable shape, Round 117 §15 body registered carry).
serde_json.workspace = true
thiserror.workspace = true
# Round 293 — commit↔ledger drift gate parses commit subjects ("(R<N>)" /
# "(Round <N>)") and atomic ledger entry-id keys via a small fixed pattern set.
regex.workspace = true

# Round 859 — SIGPIPE only. Rust installs SIG_IGN before `main`, so a report
# piped into `head` dies at exit 101 with a `Broken pipe` panic instead of
# ending like `cat` does; restoring the default disposition needs one libc call
# and the unstable `#[unix_sigpipe]` attribute is not an option on stable.
# Unix-gated: `SIGPIPE` does not exist on Windows, and neither does the defect.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
yaml-rust2 = { workspace = true }
# THE one answer to what this repository's CI runs. Shared with the gate in
# `tools/unrun-tests` rather than copied into each — R1083 is what a second
# derivation of it costs.
ci-plan = { path = "../../tools/ci-plan" }
# The consolidation laws ask a manifest which test targets it DECLARES. That is
# a TOML question, and the answer this crate needs — is this file a declared
# target, or only a string that appears in the file — is exactly what a text
# search cannot tell apart.
toml = { workspace = true }
# The ledger tests ask whether an entry id carries a round pin. That question
# already has one answer in production (`project::parse_round_number`, the
# resolver the changelog projection keys on), so the tests borrow it rather
# than re-deciding what a pin looks like.
mnemosyne-atomic = { path = "../mnemosyne-atomic" }
# The backlog walk asks each contract in `tests/` which pair of reads it judges,
# by reading the `const DECLARES` out of its source. See the workspace entry.
syn = { workspace = true }
# The symbol-axis reach contract checks that the report prints the EXTENSION
# TABLE's own range rather than a language list retyped into the command, so it
# needs the library the command reads it from.
mnemosyne-validate = { path = "../mnemosyne-validate" }
# The three backends whose specs have no predecessor to be diffed against, so
# their contract puts them to a REAL corpus instead. Already normal dependencies
# of this crate; named here so an integration test can reach them.
mnemosyne-plugin-tree-sitter-go = { path = "../mnemosyne-plugin-tree-sitter-go" }
mnemosyne-plugin-tree-sitter-python = { path = "../mnemosyne-plugin-tree-sitter-python" }
mnemosyne-plugin-tree-sitter-kotlin = { path = "../mnemosyne-plugin-tree-sitter-kotlin" }
# Round 1161 — the corpus contract asks each backend's compiled query how many
# declaration patterns it DECLARES and which of them a source reached, so it
# needs the crate those two live on rather than a count typed beside the shapes.
mnemosyne-plugin-tree-sitter-core = { path = "../mnemosyne-plugin-tree-sitter-core" }
mnemosyne-core = { path = "../mnemosyne-core" }

[lints]
workspace = true

[build-dependencies]
mnemosyne-build-stamp = { path = "../mnemosyne-build-stamp" }
