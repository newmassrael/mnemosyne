[package]
name = "mnemosyne-validate"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
mnemosyne-core = { path = "../mnemosyne-core" }
mnemosyne-config = { path = "../mnemosyne-config" }
mnemosyne-atomic = { path = "../mnemosyne-atomic" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
regex.workspace = true
# Round 1324 — the inventory attribute axis parses a declared document as XML.
roxmltree.workspace = true
# Round 1334 — a declared citation reader is handed the document on stdin from a
# FILE rather than a pipe. A pipe cannot be written to safely here: this gate
# runs inside a binary that restores `SIG_DFL` for `SIGPIPE` (Round 859), so a
# reader that exits without reading its input kills the gate mid-scan, with no
# output and no message. A file has no reader to close.
tempfile.workspace = true
# Round 1223 — OPTIONAL, off by default, the shape Round 690 established for
# core and atomic and Round 1222 extended to ops. Only the `schemars` feature —
# enabled solely by mnemosyne-mcp — pulls it, so the reports this crate produces
# can publish a real MCP `output_schema` from the one type.
schemars = { workspace = true, optional = true }

[features]
schemars = ["dep:schemars", "mnemosyne-atomic/schemars", "mnemosyne-core/schemars"]

[dev-dependencies]
tempfile.workspace = true
mnemosyne-plugin-tree-sitter-rust = { path = "../mnemosyne-plugin-tree-sitter-rust" }
mnemosyne-plugin-tree-sitter-cpp = { path = "../mnemosyne-plugin-tree-sitter-cpp" }

[lints]
workspace = true
