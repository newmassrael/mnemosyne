[package]
name = "mnemosyne-plugin-tree-sitter-kotlin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Mnemosyne — tree-sitter Kotlin SymbolResolver backend"

[lib]
name = "mnemosyne_plugin_tree_sitter_kotlin"
path = "src/lib.rs"

[dependencies]
mnemosyne-core = { path = "../mnemosyne-core" }
mnemosyne-plugin-tree-sitter-core = { path = "../mnemosyne-plugin-tree-sitter-core" }
tree-sitter = "0.26"
# `-ng` rather than `tree-sitter-kotlin`: the older crate is the pre-transfer
# grammar and predates the ABI this workspace's tree-sitter speaks.
tree-sitter-kotlin-ng = "1.1"

[lints]
workspace = true
