[package]
name = "mnemosyne-query"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
mnemosyne-core = { path = "../mnemosyne-core" }
mnemosyne-atomic = { path = "../mnemosyne-atomic" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
regex.workspace = true
# Round 1223 — OPTIONAL, off by default, the Round 690 shape. Only the
# `schemars` feature, enabled solely by mnemosyne-mcp through ops, pulls it, so
# a view this crate returns can publish a real MCP `output_schema`.
schemars = { workspace = true, optional = true }

[features]
schemars = ["dep:schemars", "mnemosyne-atomic/schemars", "mnemosyne-core/schemars"]

[dev-dependencies]

[lints]
workspace = true
