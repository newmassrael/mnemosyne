[package]
name = "mnemosyne-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "mnemosyne-mcp"
path = "src/main.rs"

[dependencies]
# Round 1222 — the `schemars` feature is what lets the mutate answer type
# publish a real `output_schema`; same opt-in shape as atomic/core below.
mnemosyne-ops = { path = "../mnemosyne-ops", features = ["schemars"] }
# Round 1337 — the same backend table the CLI ships, so the citation gate
# answers the symbol axis alike on both surfaces. A surface with no resolvers
# would report `not judged — no resolver` by name rather than silently, which is
# honest and still leaves an agent fixing what its tool sees and being refused by
# the hook on an axis its tool never judged. MEASURED before the dependency
# (Round 1335): the five grammar rlibs are ~13.5 MB in debug and add nothing to
# COMPILE time, because this workspace already builds them for the CLI.
mnemosyne-backends = { path = "../mnemosyne-backends" }
mnemosyne-config = { path = "../mnemosyne-config" }
# Round 690 — enable the atomic/core `schemars` feature so the manifest / fact
# DTOs derive JsonSchema and the authoring tools type them directly (no mirror).
mnemosyne-atomic = { path = "../mnemosyne-atomic", features = ["schemars"] }
mnemosyne-core = { path = "../mnemosyne-core", features = ["schemars"] }
mnemosyne-projection = { path = "../mnemosyne-projection" }
rmcp = { version = "2", features = ["server", "transport-io", "macros"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true

[build-dependencies]
mnemosyne-build-stamp = { path = "../mnemosyne-build-stamp" }
