[package]
name = "mnemosyne-plugin-tree-sitter-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Mnemosyne — the grammar-independent half of a tree-sitter SymbolResolver backend"

[lib]
name = "mnemosyne_plugin_tree_sitter_core"
path = "src/lib.rs"

[dependencies]
mnemosyne-core = { path = "../mnemosyne-core" }
tree-sitter = "0.26"

# TESTS ONLY, AND ONE GRAMMAR IS ENOUGH — this one, for a reason it did not
# have before Round 1162. This crate is the walk without a language, so its own
# laws need SOME grammar to build a spec against, and the engine-level questions
# (is the query compiled once per process, does the kind filter refuse, does a
# trailing comment stay off the next declaration) are about the engine rather
# than about Rust. One of them is not: an INWARD-marked comment documents the
# scope it is in, and Rust's is the only grammar here that spells that at all.
[dev-dependencies]
tree-sitter-rust = "0.24"

[lints]
workspace = true
